<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Story</title>
<link rel="stylesheet" href="/footer.css">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fdeff1;
      color:#732323;
      line-height: 1.6;
    }

    header{
      text-align:center;
      padding:50px 10px;
      background:linear-gradient(to bottom, #fff, #f8dede);
      border-bottom:1px solid rgba(255,255,255,0.7);
    }

    h1,h2,h3{
      color:#a52126;
      margin-top:0;
    }

    section{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
      background:#ffffff;
      border-radius:22px;
      box-shadow:0 6px 16px rgba(0,0,0,0.13);
      margin-top:45px;
    }

    .photo{
      width:100%;
      max-height:420px;
      border-radius:20px;
      object-fit:cover;
      margin-bottom:25px;
    }


/* ====== STORY CARDS ====== */

/* hover — “парит” */
section:hover {
  transform: translateY(-8px);
  box-shadow:
    0 45px 90px rgba(0, 0, 0, 0.22),
    0 18px 36px rgba(0, 0, 0, 0.14);
}

/* заголовки внутри карточек */
section h2 {
  font-size: 32px;
  margin-bottom: 18px;
  color: #a52126;
}

/* текст */
section p {
  font-size: 18px;
  line-height: 1.75;
  color: #6f2a2a;
  margin-bottom: 40px;
}

/* последнее описание — без лишнего отступа */
section p:last-child {
  margin-bottom: 0;
}


@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}



/* контейнер */
section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
  
}


/* ====== ОТДЕЛЬНАЯ КАРТОЧКА ====== */
.story-card {
  margin-top: 50px;
  padding: 50px 60px;

  max-height: 220px;
  overflow-y: auto;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff6f7 100%
  );

  border-radius: 30px;

  box-shadow:
    0 28px 60px rgba(0, 0, 0, 0.18),
    0 12px 24px rgba(0, 0, 0, 0.10);

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;
}


/* Apple-like scrollbar */
.story-card::-webkit-scrollbar{
  width:8px;
}

.story-card::-webkit-scrollbar-track{
  background:transparent;
}

.story-card::-webkit-scrollbar-thumb{
  background:rgba(165,33,38,.18);
  border-radius:999px;
}

.story-card::-webkit-scrollbar-thumb:hover{
  background:rgba(165,33,38,.32);
}


/* эффект парения */
.story-card:hover {
  transform: translateY(-6px);
  box-shadow:
    0 45px 90px rgba(0, 0, 0, 0.22),
    0 18px 36px rgba(0, 0, 0, 0.14);
}

/* заголовок (из Quill) */
.story-card h2 {
  font-size: 28px;
  margin-bottom: 12px;
  color: #a52126;
}

/* ===== TEXT (PREMIUM TYPOGRAPHY) ===== */
.story-card p {
  font-size: 18px;
  line-height: 1.7;
  color: #6f2a2a;

  margin: 0 0 18px 0;   /* 🔥 расстояние между абзацами */
  padding: 0;
}

/* последний абзац без лишнего отступа */
.story-card p:last-child {
  margin-bottom: 0;
}

/* заголовок + текст spacing */
.story-card h2 + p {
  margin-top: 6px;
}


/* иногда Quill вставляет <p><br></p> */
.story-card p:has(br:only-child) {
  display: none;
}

/* перенос строки как мягкий break */
.story-card br {
  display: block;
  content: "";
  margin-top: 6px;
}

/* чуть улучшает читаемость длинных текстов */
.story-card {
  letter-spacing: 0.2px;
}

.story-card {
  opacity: 0;
  transform: translateY(10px);
}



.story-card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: all 0.4s ease;
}


/* ====== HERO ====== */
.story-hero {
  max-width: 1100px;
  margin: 40px auto 60px;
  overflow: hidden;
}

/* VIEWPORT */
.story-marquee {
  width: 100%;
  overflow: hidden;
}

/* ДВИЖУЩАЯСЯ ЛЕНТА */
.story-track {
  display: flex;
  gap: 22px;
  width: max-content;

  animation: marquee 45s linear infinite;
  will-change: transform;
}

/* PAUSE ON HOVER */
.story-marquee:hover .story-track {
  animation-play-state: paused;
}

/* КАРТИНКИ */
.story-track img {
  width: 320px;
  height: 240px;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 26px;

  box-shadow:
    0 18px 30px rgba(0,0,0,0.18),
    0 6px 14px rgba(0,0,0,0.12);
}


.story-photo-card {
  display: flex;
  flex-direction: column;
  gap: 10px;

  width: 320px;
  flex-shrink: 0;
position: relative;
overflow: hidden;
border-radius: 26px;
}

.story-photo-caption {

  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 14px;

  padding: 8px 14px 6px;

  border-radius: 18px;

  background: rgba(255,255,255,.18);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,.22);

  color: white;

  font-size: 14px;
  line-height: 18px;

  text-shadow:
    0 2px 10px rgba(0,0,0,.45);

  box-shadow:
    0 8px 30px rgba(0,0,0,.18);

  overflow: hidden;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;

  height: 30px;

  transition:
    height .4s ease,
    background .35s ease;
}

/* hover = раскрытие */
.story-photo-card:hover .story-photo-caption {

  -webkit-line-clamp: unset;

  height: auto;
  max-height: 240px;

  background: rgba(255,255,255,.22);
}

/* APPLE MARQUEE */
@keyframes marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

/* =========================
   🍏 APPLE EDGE FADE
   ========================= */

.story-hero {
  position: relative;
}

/* ЛЕВАЯ и ПРАВАЯ маски */
.story-hero::before,
.story-hero::after {
  content: "";
  position: absolute;
  top: 0;
  width: 120px;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

/* ЛЕВЫЙ FADE */
.story-hero::before {
  left: 0;
  background: linear-gradient(
    to right,
    rgba(253,239,241,1) 0%,
    rgba(253,239,241,0) 100%
  );
}

/* ПРАВЫЙ FADE */
.story-hero::after {
  right: 0;
  background: linear-gradient(
    to left,
    rgba(253,239,241,1) 0%,
    rgba(253,239,241,0) 100%
  );
}

/* ===== TEXTAREA-LIKE MODE FOR STORY ===== */

/* Quill иногда вставляет пустые <p><br></p> */
.story-card p:empty {
  display: none;
}

/* если внутри Quill есть <br> */
.story-card br {
  display: block;
  content: "";
  margin-top: 0;
}

[data-visible] {
  visibility: visible;
}

/* ===== WEDDING NAVBAR ===== */

.wedding-nav {
  position: sticky;
  top: 0;
  z-index: 999;

  display: flex;
  align-items: center;

  padding: 14px 28px;

  background: rgba(255, 245, 246, 0.82);
  backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(165, 33, 38, 0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.nav-left {
  position: relative;
  z-index: 2;
  margin-left: 40px; /* 👈 ВОТ ОНО */
}

/* BACK BUTTON — без изменений */
.back-btn {
  background: linear-gradient(135deg, #a52126, #7b1f22);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;

  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  transition: all .25s ease;
}

.back-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.28);
}

/* 🔥 ЦЕНТР СТРАНИЦЫ */
.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 18px;
  white-space: nowrap;
}
.nav-center a {
  font-size: 15px;
  font-weight: 500;
  color: #732323;
  text-decoration: none;
  cursor: pointer;

  position: relative;
  padding-bottom: 4px;
}

.nav-center a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: #a52126;
  transition: width .3s ease;
}

.nav-center a:hover::after {
  width: 100%;
}

.nav-center a.active {
  color: #a52126;
}

.nav-center a.active::after {
  width: 100%;
}



/* === STORY HERO AUTO SCROLL STRIP === */

/* фиксируем нормальную высоту блока */
.story-hero {
  overflow: visible;   /* ✅ не режем */
  padding: 40px 0;
}

.story-slider {
  padding: 0 40px;     /* можно меньше */
}

/* сама лента */
.story-slider {
  height: 300px;
  display: flex;
  gap: 22px;

  overflow-x: auto;        /* ✅ разрешаем скролл */
  overflow-y: hidden;

  justify-content: flex-start; /* ✅ не центр */
  scroll-behavior: smooth;

  scrollbar-width: none;      /* Firefox */
}

.story-slider::-webkit-scrollbar {
  display: none;               /* Chrome / Safari */
}

/* картинки */
.story-slider img {
  width: 320px;          /* 🔥 фото крупнее */
  height: 240px;

  object-fit: cover;
  flex-shrink: 0;

  border-radius: 26px;   /* 🔥 скругление */
  
  /* 🔥 подсветка + объём */
  box-shadow:
    0 18px 30px rgba(0,0,0,0.18),
    0 6px 14px rgba(0,0,0,0.12);

  background: #f3eaea;
}

.story-slider img {
  opacity: 1 !important;
  position: relative !important;
}


.story-hero {
  border-radius: 32px;
  overflow: visible;
}

/* =========================
   🍏 IMAGE LIGHTBOX
   ========================= */

.image-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}

.image-lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

.image-lightbox img {
  max-width: 80vw;
  max-height: 80vh;

  border-radius: 28px;
  box-shadow:
    0 40px 120px rgba(0,0,0,0.35);

  transform: scale(0.25);
  transition: transform .45s cubic-bezier(.2,.8,.2,1);
}

.image-lightbox.active img {
  transform: scale(1);
}

.story-hero img {
  cursor: zoom-in;
}

.image-lightbox img {
  cursor: zoom-out;
}

/* =========================
   📱 ORGANIC MOBILE STORY
   ========================= */
@media (max-width: 768px) {

  /* общий воздух */
  body {
    line-height: 1.45;
  }

  header {
    padding: 28px 14px;
  }

  header h1 {
    font-size: 26px;
  }

    font-size: 15px !important;

  /* HERO картинки — не бегущая строка, а нативный свайп */

  .story-hero {
    overflow: visible !important;
    margin: 10px 0 20px;

    overflow: visible !important;
  }

.story-track {
  display: flex !important;
  gap: 12px;

  width: max-content;

  overflow: visible;

  animation: marquee 38s linear infinite;  /* как desktop */
}

  .story-track::-webkit-scrollbar {
    display: none;
  }

  .story-track img {
    flex: 0 0 42vw;

    object-fit: cover;

    scroll-snap-align: start;

      0 10px 18px rgba(0,0,0,0.15),

  }

  .story-hero::after {
    display: none !important;
  }
}

/* 📱 MOBILE — DESKTOP STYLE MARQUEE ВНУТРИ КАРТОЧКИ */
@media (max-width: 768px) {

  .story-hero {
    overflow: hidden !important;     /* режем по белой карточке */
    margin: 10px 0 20px;
  }

  .story-marquee {
    overflow: hidden !important;

  .story-track {

  .story-track img {
    width: 46%;      /* ← видно РОВНО 2 фото */

    object-fit: cover;
    border-radius: 16px;

    flex-shrink: 0;

    box-shadow:
      0 10px 18px rgba(0,0,0,0.15),
      0 4px 8px rgba(0,0,0,0.08);
  }

  .story-hero::before,
  .story-hero::after {
    display: none !important;
  }
}

/* =========================
   GLASS LOADING OVERLAY

#loadingOverlay {

  box-shadow:
    0 0 30px rgba(165,33,38,.35);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

function buildPublicUrl(bucket, path) {
  if (!path) return "";
  const trimmed = path.replace(/^\/+/, "");
  const parts = trimmed.split("/");

  if (parts.length === 1) {
    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(trimmed)}`;

  const filename = encodeURIComponent(parts.at(-1));
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${folder}/${filename}`;
}

function enableAutoScroll(row, speed = 0.25) {
  let stopped = false;

  function step() {
    if (!stopped) {
      row.scrollLeft += speed;
      if (row.scrollLeft + row.clientWidth >= row.scrollWidth - 1) {
        stopped = true;
      }
    }
    requestAnimationFrame(step);
  }

  function stop() {
    stopped = true;
  }

  row.addEventListener("mouseenter", stop);
  row.addEventListener("wheel", stop, { passive: true });
  row.addEventListener("touchstart", stop, { passive: true });
  row.addEventListener("mousedown", stop);

  requestAnimationFrame(step);
}

/* =========================================
   🍎 APPLE STYLE MARQUEE — JS DRIVEN
   ========================================= */

async function initStorySlider(){

  await loadStoryImageSlider();

  const track = document.getElementById("storyHeroImages");
  if (!track) return;

  // 📱 MOBILE — НИЧЕГО НЕ ДЕЛАЕМ
  if (window.innerWidth <= 768) {
    return;
  }

  if (track.children.length < 4) return;

  // duplicate content (infinite)
  track.innerHTML += track.innerHTML;

  const marquee = track.closest(".story-hero");
  if (!marquee) return;

  let x = 0;
  let velocity = 0.08;
  let isDragging = false;
  let lastX = 0;
  let rafId = null;

  const render = () => {

    x -= velocity;

    // infinite loop
    if (Math.abs(x) >= track.scrollWidth / 2) {
      x = 0;
    }

    track.style.transform = `translateX(${x}px)`;

    rafId = requestAnimationFrame(render);
  };

  const stop = () => cancelAnimationFrame(rafId);

  const start = () => render();

  /* ---------- DRAG ---------- */

  const startDrag = (clientX) => {
    isDragging = true;
    lastX = clientX;
    velocity = 0;
  };

  const moveDrag = (clientX) => {

    if (!isDragging) return;

    const dx = clientX - lastX;

    lastX = clientX;

    x += dx;

    velocity = dx * 0.15;
  };

  const endDrag = () => {

    if (!isDragging) return;

    isDragging = false;

    startInertia();
  };

  /* ---------- INERTIA ---------- */

  const startInertia = () => {

    const friction = 0.95;

    const step = () => {

      velocity *= friction;

      if (Math.abs(velocity) < 0.01) {

        velocity = 0.15;

        return;
      }

      x += velocity;

      requestAnimationFrame(step);
    };

    requestAnimationFrame(step);
  };

  /* ---------- EVENTS ---------- */

  marquee.addEventListener("mouseenter", stop);

  marquee.addEventListener("mouseleave", start);

  marquee.addEventListener("mousedown", e => {
    startDrag(e.clientX);
  });

  window.addEventListener("mousemove", e => {
    moveDrag(e.clientX);
  });

  window.addEventListener("mouseup", endDrag);

  marquee.addEventListener(
    "touchstart",
    e => startDrag(e.touches[0].clientX),
    { passive: true }
  );

  marquee.addEventListener(
    "touchmove",
    e => moveDrag(e.touches[0].clientX),
    { passive: true }
  );

  marquee.addEventListener("touchend", endDrag);

  // START
  start();
}

</script>

<script>
async function loadStoryContent() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (!token) return;

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/our_story_page?select=how_we_met,growing_together,proposal,new_chapter,custom&edit_token=eq.${token}`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();
    if (!data || !data.length) return;

    const row = data[0];

    const fields = [
      "how_we_met",
      "growing_together",
      "proposal",
      "new_chapter",
      "custom"
    ];

fields.forEach(key => {
  const el = document.getElementById(key);
  if (!el) return;

  const card = el.closest(".story-card");

  const cleaned = (row[key] || "")
    .replace(/<p><br><\/p>/g, "")
    .replace(/<p>\s*<\/p>/g, "")
    .trim();

  if (cleaned) {
    el.innerHTML = cleaned;

    if (card) {
      card.style.display = "block";

      // 🔥 плавное появление БЕЗ вспышки
      card.style.opacity = "0";

      requestAnimationFrame(() => {
        card.style.transition = "all 0.4s ease";
        card.style.opacity = "1";
        card.style.transform = "translateY(0)";
      });
    }

  } else {
    if (card) card.style.display = "none";
  }
});

  } catch (e) {
    console.error("loadStoryContent error", e);
  }
}

</script>

function getToken() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (token) sessionStorage.setItem("rsvpToken", token);
  return token;
}

function buildLink(path) {
  const token = getToken();

  if (path === "home") {
    return `https://flowwed.netlify.app/index.html?t=${token}`;
  }

  if (!token) return path;
  return `${path}?t=${token}`;
}

document.querySelectorAll("[data-page]").forEach(link => {
  const page = link.dataset.page;
  link.href = buildLink(page);
});

function goBack() {
  history.length > 1 ? history.back() : window.location.href = buildLink("home");
}
</script>
