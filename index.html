async function fetchWithRetry(url, options, retries = 3) {

  for (let i = 1; i <= retries; i++) {

    try {

      return await fetch(url, options);

      console.warn(`FETCH FAILED ${i}/${retries}`);

      if (i === retries) throw err;

      await new Promise(r => setTimeout(r, 500));
    }
  }

function smoothScrollToVideo(duration = 3500) {

  const el = document.getElementById("video");

  const start = window.scrollY;

  const target =
    start +
    el.getBoundingClientRect().top -
    (window.innerHeight - el.offsetHeight) / 2 -
    40;

  const distance = target - start;

  const startTime = performance.now();

  function step(now) {

    const t = Math.min(
      1,
      (now - startTime) / duration
    );

    const ease =
      t * t * (3 - 2 * t);

    window.scrollTo(
      0,
      start + distance * ease
    );

    if (t < 1)
      requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}



function slowScrollTo(el, duration = 1500) {
  const start = window.scrollY;

  // определяем mobile / desktop
  const isMobile = window.innerWidth <= 768;

  // разный offset для mobile и desktop
  const offset = isMobile
    ? window.innerHeight * 0.20   // 📱 МЕНЬШЕ скролл в mobile
    : window.innerHeight * 0.67;  // 🖥 как было в desktop

  const target =
    el.getBoundingClientRect().top +
    window.scrollY -
    offset;

  const distance = target - start;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = t * t * (3 - 2 * t);
    window.scrollTo(0, start + distance * ease);
    if (t < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

<script>

function smoothMobileScrollTo(el, duration = 900) {
  const start = window.scrollY;
  const rect = el.getBoundingClientRect();

  const target =
    start +
    rect.top -
    (window.innerHeight - rect.height) / 2;

  const distance = target - start;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = t * t * (3 - 2 * t);
    window.scrollTo(0, start + distance * ease);
    if (t < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}


</script>
