<script>
function buildPublicUrl(bucket, path) {
  if (!path) return "";

  const trimmed = path.replace(/^\/+/, "");
  const parts = trimmed.split("/");

  if (parts.length === 1) {
    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(trimmed)}`;
  }

  const folder = parts.slice(0, -1).join("/");
  const filename = encodeURIComponent(parts.at(-1));

  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${folder}/${filename}`;
}

<script>
function cleanHtml(html) {
  return (html || "")
    .replace(/<p><br><\/p>/g, "")
    .replace(/<p>\s*<\/p>/g, "")
    .trim();
}

function isEmptyHtml(html) {
  const text = (html || "")
    .replace(/&nbsp;/g, " ")
    .replace(/<br\s*\/?>/gi, "")
    .replace(/<[^>]+>/g, "")
    .trim();

  return text === "";
}


function makeStoryCard(title, html) {

  if (isEmptyHtml(html)) return null;

  const cleaned = cleanHtml(html);

  const card = document.createElement("article");
  card.className = "story-card";

  const body = document.createElement("div");
  body.className = "story-body";

  body.innerHTML = cleaned;

  requestAnimationFrame(() => {

    function updateFade() {

      const atEnd =
        body.scrollTop + body.clientHeight >=
        body.scrollHeight - 4;

      body.classList.toggle("at-end", atEnd);
    }

    updateFade();

    body.addEventListener("scroll", updateFade);
  });

  card.appendChild(body);

  return card;
}

function makePhotoRibbon(photos, offset = 0) {
  if (!photos.length) return null;

  const ribbon = document.createElement("div");
  ribbon.className = "photo-ribbon";

  photos.forEach((p, index) => {

  const globalIndex = offset + index;


    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = p.src;
    img.loading = "lazy";
    img.decoding = "async";

img.onload = () => {

  if (img.naturalHeight > img.naturalWidth) {
    card.classList.add("portrait");
  }

};


    img.addEventListener("click", () => {

currentImageIndex = globalIndex;
openLightbox(globalIndex);
    });

    card.appendChild(img);

card.addEventListener("click", () => {

  currentImageIndex = globalIndex;

  openLightbox(globalIndex);

});


    if (p.caption.trim()) {
      const cap = document.createElement("div");
      cap.className = "photo-caption";
      cap.textContent = p.caption.trim();
      card.appendChild(cap);
    }

    ribbon.appendChild(card);
});

let velocity = 0;

ribbon.addEventListener("touchstart", () => {
  velocity = 0;
}, { passive: true });

ribbon.addEventListener("touchmove", e => {
  velocity =
    e.touches[0].clientX;
}, { passive: true });

ribbon.addEventListener("touchend", () => {

  let momentum = velocity * 0.015;

  function glide() {

    ribbon.scrollLeft -= momentum;

    momentum *= 0.94;

    if (Math.abs(momentum) > 0.2) {
      requestAnimationFrame(glide);
    }
  }

  requestAnimationFrame(glide);

}, { passive: true });


let drift = 0.30;

let virtualScroll = 0;
let isInteracting = false;


ribbon.addEventListener("touchstart", () => {
  isInteracting = true;
});

ribbon.addEventListener("touchend", () => {

  virtualScroll = ribbon.scrollLeft;

  setTimeout(() => {
    isInteracting = false;
  }, 120);

});


ribbon.addEventListener("scroll", () => {
  if (isInteracting) {
    virtualScroll = ribbon.scrollLeft;
  }
});


function autoDrift() {

  if (
    ribbon.scrollWidth <= ribbon.clientWidth
  ) {

    requestAnimationFrame(autoDrift);

    return;
  }

if (!isInteracting) {

  virtualScroll += drift;

  ribbon.scrollLeft = virtualScroll;
}

  const max =
    ribbon.scrollWidth - ribbon.clientWidth;

  if (virtualScroll >= max) {

    drift = -0.30;
  }

  if (virtualScroll <= 0) {

    drift = 0.30;
  }

  requestAnimationFrame(autoDrift);
}

setTimeout(() => {

  requestAnimationFrame(autoDrift);

}, 1200);


return ribbon;
}

function renderMobileStory(content, photos) {
  const flow = document.getElementById("storyFlow");
  const empty = document.getElementById("emptyState");

  flow.innerHTML = "";

const fields = [
  [null, content?.how_we_met],
  [null, content?.growing_together],
  [null, content?.proposal],
  [null, content?.new_chapter],
  [null, content?.custom]
];

  const visibleCards = fields
    .map(([title, html]) => makeStoryCard(title, html))
    .filter(Boolean);

  if (!visibleCards.length && !photos.length) {
    empty.style.display = "block";
    flow.appendChild(empty);
    return;
  }

  if (photos[0]) {
    document.getElementById("heroImg").src = photos[0].src;
    document.getElementById("heroPhoto").style.display = "block";
  }

const cardsCount =
  visibleCards.length || 1;

const perRibbon =
  Math.ceil(
    photos.length / cardsCount
  );

const chunks = [];

for (
  let i = 0;
  i < photos.length;
  i += perRibbon
) {

  chunks.push(
    photos.slice(i, i + perRibbon)
  );
}


  let offset = 0;

  visibleCards.forEach((card, i) => {

    flow.appendChild(card);

    const chunk =
      chunks[i] || [];

    const ribbon =
      makePhotoRibbon(
        chunk,
        offset
      );

    if (ribbon) {
      flow.appendChild(ribbon);
    }

    offset += chunk.length;
  });

  if (!visibleCards.length) {

    const ribbon =
      makePhotoRibbon(
        photos,
        0
      );

    if (ribbon) {
      flow.appendChild(ribbon);
    }
  }
}


</script>

  currentImageIndex = index;

  const item = storyPhotos[index];

const zoomImg =
  document.getElementById("lightboxImg");

currentScale = 1;

zoomImg.style.transform = "scale(1)";

zoomImg.dataset.zoomed = "0";

  document.getElementById("lightboxImg").src = item.src;

  const cap = document.getElementById("lightboxCaption");

  if (item.caption.trim()) {
    cap.textContent = item.caption.trim();
    cap.style.display = "block";
  } else {
    cap.textContent = "";
    cap.style.display = "none";
  }

  document.getElementById("lightbox").classList.add("active");

document.body.classList.add("lightbox-open");

}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");

document.body.classList.remove("lightbox-open");

  document.getElementById("lightboxImg").src = "";
}

document.getElementById("closeLightbox").addEventListener("click", closeLightbox);

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") closeLightbox();
});

document.getElementById("prevBtn").addEventListener("click", e => {
  e.stopPropagation();
  openLightbox(currentImageIndex - 1);
});

document.getElementById("nextBtn").addEventListener("click", e => {
  e.stopPropagation();
  openLightbox(currentImageIndex + 1);
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});

let currentScale = 1;

document
  .getElementById("lightboxImg")
  ?.addEventListener("click", e => {

    e.stopPropagation();

    const img = e.currentTarget;

    const zoomed =
      img.dataset.zoomed === "1";

    if (zoomed) {

      img.style.transform = "scale(1)";

      img.dataset.zoomed = "0";

      currentScale = 1;

    } else {

      img.style.transform = "scale(1.2)";

      img.dataset.zoomed = "1";

      currentScale = 1.2;
    }

});

let startDistance = 0;
let startScale = 1;

const zoomImg =
  document.getElementById("lightboxImg");

function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

zoomImg.addEventListener("touchstart", e => {

  if (e.touches.length === 2) {

    startDistance =
      getDistance(e.touches);

    startScale =
      currentScale;
  }

}, { passive:false });

zoomImg.addEventListener("touchmove", e => {

  if (e.touches.length !== 2) return;

  e.preventDefault();

  const newDistance =
    getDistance(e.touches);

  let scale =
    startScale *
    (newDistance / startDistance);

  scale = Math.max(1, Math.min(2, scale));

  currentScale = scale;

  zoomImg.style.transform =
    `scale(${scale})`;

}, { passive:false });


</script>


<script>
(async () => {
  try {
    await loadCoupleName();

    storyPhotos = await loadStoryPhotos();

    const content = await loadStoryContent();

    renderMobileStory(content, storyPhotos);

const observer =
  new IntersectionObserver(entries => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {

        entry.target.classList.add("visible");

      }

    });

  }, {
    threshold: 0.12
  });

document
  .querySelectorAll(
    ".story-card, .photo-ribbon"
  )
  .forEach(el => {
    observer.observe(el);
  });

  } catch (err) {
    console.error(err);

    const empty = document.getElementById("emptyState");
    empty.style.display = "block";
    empty.textContent = "Could not load story.";

  } finally {
    document.getElementById("loading").classList.add("hide");
  }
})();
</script>
