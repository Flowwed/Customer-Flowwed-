.ribbon-shell {

backface-visibility: hidden;

.photo-card {

  position: relative;

  width: 100%;

  max-width: 340px;

  margin: 0 auto;

  flex-shrink: 0;

  overflow: hidden;

  border-radius: 24px;

  background: #f7eeee;


--music-offset: 0px;
--music-scale: 1;
--music-rotate: 0deg;

.photo-card.portrait img {

}

      scale(var(--music-scale))
      rotate(calc(0deg + var(--music-rotate)));
  }

  25% {
    transform:
      translateY(calc(-3px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(-0.4deg + var(--music-rotate)));
  }

  50% {
    transform:
      translateY(calc(-6px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(0.4deg + var(--music-rotate)));
  }

  75% {
    transform:
      translateY(calc(-3px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(-0.3deg + var(--music-rotate)));
  }

  100% {
    transform:
      translateY(calc(0px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(0deg + var(--music-rotate)));
  }

<script>

let currentLightboxIndex = 0;

let galleryImages = [];

async function openLightbox(src, caption) {

  const lightbox =
    document.getElementById("lightbox");

  const img =
    document.getElementById("lightboxImg");


  const cap =
    document.getElementById("lightboxCaption");
cap.classList.remove("expanded");

  const preload = new Image();

  preload.src = src;

  await preload.decode().catch(() => {});

  img.src = src;

  if (caption && caption.trim()) {

    cap.textContent =
      caption.trim();

    cap.style.display = "block";

  } else {

    cap.textContent = "";

    cap.style.display = "none";
  }

  requestAnimationFrame(() => {

    lightbox.classList.add("active");
document.body.classList.add("lightbox-open");

  });
}

function closeLightbox() {
  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");

  lightbox.classList.remove("active");

document.body.classList.remove("lightbox-open");

  img.src = "";
}

document.getElementById("closeLightbox").addEventListener("click", closeLightbox);

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") closeLightbox();
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});

document
  .getElementById("lightboxCaption")
  ?.addEventListener("click", e => {

    e.stopPropagation();

    e.currentTarget.classList.toggle("expanded");

});


document
  .getElementById("lightboxImg")
  ?.addEventListener("click", e => {

    e.stopPropagation();

    const img =
      e.currentTarget;

    const zoomed =
      img.dataset.zoomed === "1";

    if (zoomed) {

      img.style.transform = "scale(1)";

      img.dataset.zoomed = "0";

    } else {

      img.style.transform = "scale(1.2)";

      img.dataset.zoomed = "1";
    }

});


let currentScale = 1;

let startDistance = 0;
let startScale = 1;

const img =
  document.getElementById("lightboxImg");

function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

img.addEventListener("touchstart", e => {

  if (e.touches.length === 2) {

    startDistance =
      getDistance(e.touches);

    startScale =
      currentScale;
  }

}, { passive:false });

img.addEventListener("touchmove", e => {

  if (e.touches.length !== 2) return;

  e.preventDefault();

  const newDistance =
    getDistance(e.touches);

  let scale =
    startScale *
    (newDistance / startDistance);

  scale = Math.max(1, Math.min(2, scale));

  currentScale = scale;

  img.style.transform =
    `scale(${scale})`;

}, { passive:false });



</script>

<script>
async function loadBackgroundMusicForPage() {
  const token = getToken();
  if (!token) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_site_page_music`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        p_token: token,
        p_page_key: "just_married"
      })
    });

    const rows = await res.json();
    if (!rows.length || !rows[0].music_path) return;

    const audio = document.getElementById("bgMusic");
    audio.crossOrigin = "anonymous";

    audio.src =
      `${SUPABASE_URL}/storage/v1/object/public/music/${rows[0].music_path.trim()}`;

    audio.load();

  } catch (err) {
    console.log("Music load error", err);
  }
}

const musicBtn = document.getElementById("musicBtn");

let audioContext;
let analyser;
let dataArray;
let audioInitialized = false;

const bgMusic = document.getElementById("bgMusic");

async function initAudioSystem() {

  if (audioInitialized) return;

  audioInitialized = true;

audioContext =
  new (window.AudioContext || window.webkitAudioContext)();

await audioContext.resume();



  const source =
    audioContext.createMediaElementSource(bgMusic);

  analyser =
    audioContext.createAnalyser();

  analyser.fftSize = 128;

  dataArray =
    new Uint8Array(analyser.frequencyBinCount);

  source.connect(analyser);

  analyser.connect(audioContext.destination);

  startMusicMotion();
}


document.addEventListener(
  "visibilitychange",
  async () => {

    if (document.visibilityState === "hidden") {

      bgMusic.pause();

musicBtn.textContent = "🎵";
musicBtn.classList.remove("playing");


      return;
    }

    if (
      document.visibilityState === "visible" &&
      audioContext &&
      audioContext.state === "suspended"
    ) {

      try {

        await audioContext.resume();

        if (
          musicBtn.classList.contains("playing")
        ) {

          await bgMusic.play();

        }

      } catch (e) {}

    }

});



musicBtn.addEventListener("click", async () => {

if (musicBtn.dataset.locked === "1") return;

musicBtn.dataset.locked = "1";

  if (!bgMusic.src) return;

  if (bgMusic.paused) {

    await bgMusic.play().catch(() => {});

    musicBtn.textContent = "🎶";

    musicBtn.classList.add("playing");

await initAudioSystem();

  } else {

    bgMusic.pause();

    musicBtn.textContent = "🎵";

    musicBtn.classList.remove("playing");
  }

 setTimeout(() => {
    musicBtn.dataset.locked = "0";
  }, 220);

});

loadBackgroundMusicForPage();

</script>


<script>

function initRibbonAnimation() {


const mover =
  document.getElementById("ribbonMover");

const track =
  document.getElementById("ribbon");


  if (!track) return;

  if (track.children.length < 1) return;


  let y = 0;

  const speed = 0.42;


let direction = -1;

  let isDragging = false;

  let startY = 0;
let velocity = 0;


function getSingleHeight() {
  return track.scrollHeight;
}


let lastVisibilityUpdate = 0;

function animate() {

const start = performance.now();

  if (document.hidden) {

    setTimeout(() => {

      requestAnimationFrame(animate);

    }, 120);

    return;
  }

  if (!isDragging) {

y += speed * direction;

y += velocity;

velocity *= 0.92;
  }

  if (Math.abs(velocity) < 0.02) {
    velocity = 0;
  }


const limit =
  Math.max(
    0,
    track.scrollHeight -
    (window.innerHeight - 130)
  );

if (y < -limit) {

  y = -limit;

  direction = 1;

  velocity = 0;
}

if (y > 0) {

  y = 0;

  direction = -1;

  velocity = 0;
}

mover.style.transform =
  `translate3d(0, ${y}px, 0)`;


  if (performance.now() - lastVisibilityUpdate > 180) {

    updateVisibleCardAnimations();

    lastVisibilityUpdate = performance.now();
  }


requestAnimationFrame(animate);


}

animate();

  // TOUCH DRAG

  track.addEventListener("touchstart", e => {

    isDragging = true;

    startY = e.touches[0].clientY;

  }, { passive: true });

  track.addEventListener("touchmove", e => {

    if (!isDragging) return;

    const delta =
      e.touches[0].clientY - startY;

    startY = e.touches[0].clientY;



y += delta;

velocity = delta * 0.18;


  }, { passive: true });

  track.addEventListener("touchend", () => {

    isDragging = false;

  });

}
</script>


<script>

let musicMotionStarted = false;

function startMusicMotion() {

  if (musicMotionStarted) return;

  musicMotionStarted = true;

  const cards =
    document.querySelectorAll(".photo-card");

  function animateMusic() {

    if (!analyser) {
      requestAnimationFrame(animateMusic);
      return;
    }

    analyser.getByteFrequencyData(dataArray);

    let avg = 0;

    for (let i = 0; i < dataArray.length; i++) {
      avg += dataArray[i];
    }

    avg /= dataArray.length;

    const power = avg / 255;

    cards.forEach((card, index) => {

      if (!card.classList.contains("floating")) {
        return;
      }

      const offset =
        Math.sin(Date.now() * 0.001 + index) * 2;

      const pulse =
        Math.sin(Date.now() * 0.002 + index) * 0.018;

      const scale =
        1 + power * 0.025 + pulse;

      const rotate =
        Math.sin(Date.now() * 0.0007 + index)
        * power * 1.5;

      card.style.setProperty(
        "--music-offset",
        `${offset}px`
      );

      card.style.setProperty(
        "--music-scale",
        scale
      );

      card.style.setProperty(
        "--music-rotate",
        `${rotate}deg`
      );

    });

    requestAnimationFrame(animateMusic);
  }

  animateMusic();
}


</script>
