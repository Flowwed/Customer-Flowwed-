<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Story</title>
<link rel="stylesheet" href="/footer.css">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fdeff1;
      color:#732323;
      line-height: 1.6;
    }

    header{
      text-align:center;
      padding:50px 10px;
      background:linear-gradient(to bottom, #fff, #f8dede);
      border-bottom:1px solid rgba(255,255,255,0.7);
    }

    h1,h2,h3{
      color:#a52126;
      margin-top:0;
    }

    section{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
      background:#ffffff;
      border-radius:22px;
      box-shadow:0 6px 16px rgba(0,0,0,0.13);
      margin-top:45px;
    }

    .photo{
      width:100%;
      max-height:420px;
      border-radius:20px;
      object-fit:cover;
      margin-bottom:25px;
    }


/* заголовки внутри карточек */
section h2 {
  font-size: 32px;
  margin-bottom: 18px;
  color: #a52126;
}

/* текст */
section p {
  font-size: 18px;
  line-height: 1.75;
  color: #6f2a2a;
  margin-bottom: 40px;
}

/* последнее описание — без лишнего отступа */
section p:last-child {
  margin-bottom: 0;
}


@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}



/* контейнер */
section {

  width: 68%;

  min-width: 720px;
  max-width: 920px;

  margin-left: 100px;
  margin-right: auto;

  padding: 20px;

  box-sizing: border-box;
}


/* ====== ОТДЕЛЬНАЯ КАРТОЧКА ====== */
.story-card {
  margin-top: 50px;
  padding: 42px 46px;

  max-height: 220px;
  overflow-y: auto;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff6f7 100%
  );

  border-radius: 30px;

  box-shadow:
    0 28px 60px rgba(0, 0, 0, 0.18),
    0 12px 24px rgba(0, 0, 0, 0.10);

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;
}


.story-card {
  margin-right: 30px;
}

/* Apple-like scrollbar */
.story-card::-webkit-scrollbar{
  width:8px;
}

.story-card::-webkit-scrollbar-track{
  background:transparent;
}

.story-card::-webkit-scrollbar-thumb{
  background:rgba(165,33,38,.18);
  border-radius:999px;
}

.story-card::-webkit-scrollbar-thumb:hover{
  background:rgba(165,33,38,.32);
}


/* эффект парения */
.story-card:hover {
  transform: translateY(-6px);
  box-shadow:
    0 45px 90px rgba(0, 0, 0, 0.22),
    0 18px 36px rgba(0, 0, 0, 0.14);
}

/* заголовок (из Quill) */
.story-card h2 {
  font-size: 28px;
  margin-bottom: 12px;
  color: #a52126;
}

/* ===== TEXT (PREMIUM TYPOGRAPHY) ===== */
.story-card p {
  font-size: 18px;
  line-height: 1.7;
  color: #6f2a2a;

  margin: 0 0 18px 0;   /* 🔥 расстояние между абзацами */
  padding: 0;
}

/* последний абзац без лишнего отступа */
.story-card p:last-child {
  margin-bottom: 0;
}

/* заголовок + текст spacing */
.story-card h2 + p {
  margin-top: 6px;
}


/* иногда Quill вставляет <p><br></p> */
.story-card p:has(br:only-child) {
  display: none;
}

/* перенос строки как мягкий break */
.story-card br {
  display: block;
  content: "";
  margin-top: 6px;
}

/* чуть улучшает читаемость длинных текстов */
.story-card {
  letter-spacing: 0.2px;
}

.story-card {
  opacity: 0;
  transform: translateY(10px);
}



.story-card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: all 0.4s ease;
}

.story-card {

  width: 78%;

}

.story-card:nth-of-type(even) {

  width: 64%;

  margin-left: auto;

}


/* ====== HERO ====== */
.story-hero {
  position: fixed;

  top: 385px;
  right: 70px;

  width: 340px;

  height: 300px;
  min-height: 700px;
  max-height: 1400px;

  overflow: hidden;

  border-radius: 28px;

  z-index: 10;
}

/* VIEWPORT */
.story-marquee {
  width: 100%;
  height: 100%;

  position: relative;

  overflow: hidden;

  touch-action: pan-y;

}

.story-marquee {
  transition: transform .2s ease;
}

.story-marquee:hover {
  transform: scale(1.01);
}


/* ===== MOVING COLUMN ===== */
.story-track {

  display: flex;
  flex-direction: column;

  gap: 12px;

  width: 100%;
  height: max-content;

  will-change: transform;

  backface-visibility: hidden;
  perspective: 1000px;

  transform: translate3d(0,0,0);
  transition: transform 0s linear;
}

/* ===== IMAGES ===== */
.story-track img {
  width: 100%;
  aspect-ratio: 1 / 1;

  object-fit: contain;

  flex-shrink: 0;

  border-radius: 22px;

  display: block;

  box-shadow:
    0 10px 22px rgba(0,0,0,0.14),
    0 3px 8px rgba(0,0,0,0.08);
}


/* ===== CARD ===== */
.story-photo-card {
  position: relative;

  width: 100%;

  flex-shrink: 0;

  overflow: hidden;

  border-radius: 24px;

  background: #f7eeee;
}


.story-photo-caption {

  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 14px;

  padding: 8px 14px 6px;

  border-radius: 18px;

  background: rgba(255,255,255,.18);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,.22);

  color: white;

  font-size: 14px;
  line-height: 18px;

  text-shadow:
    0 2px 10px rgba(0,0,0,.45);

  box-shadow:
    0 8px 30px rgba(0,0,0,.18);

  overflow: hidden;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;

  height: 30px;

  transition:
    height .4s ease,
    background .35s ease;
}

/* hover = раскрытие */
.story-photo-card:hover .story-photo-caption {

  -webkit-line-clamp: unset;

  height: auto;
  max-height: 240px;

  background: rgba(255,255,255,.22);
}

/* APPLE MARQUEE */
@keyframes verticalMarquee {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-50%);
  }
}



/* ===== TEXTAREA-LIKE MODE FOR STORY ===== */

/* Quill иногда вставляет пустые <p><br></p> */
.story-card p:empty {
  display: none;
}

/* если внутри Quill есть <br> */
.story-card br {
  display: block;
  content: "";
  margin-top: 0;
}

[data-visible] {
  visibility: visible;
}

/* ===== WEDDING NAVBAR ===== */

.wedding-nav {
  position: sticky;
  top: 0;
  z-index: 999;

  display: flex;
  align-items: center;

  padding: 14px 28px;

  background: rgba(255, 245, 246, 0.82);
  backdrop-filter: blur(12px);

  border-bottom: 1px solid rgba(165, 33, 38, 0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.nav-left {
  position: relative;
  z-index: 2;
  margin-left: 40px; /* 👈 ВОТ ОНО */
}

/* BACK BUTTON — без изменений */
.back-btn {
  background: linear-gradient(135deg, #a52126, #7b1f22);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;

  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  transition: all .25s ease;
}

.back-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.28);
}

/* 🔥 ЦЕНТР СТРАНИЦЫ */
.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 18px;
  white-space: nowrap;
}
.nav-center a {
  font-size: 15px;
  font-weight: 500;
  color: #732323;
  text-decoration: none;
  cursor: pointer;

  position: relative;
  padding-bottom: 4px;
}

.nav-center a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: #a52126;
  transition: width .3s ease;
}

.nav-center a:hover::after {
  width: 100%;
}

.nav-center a.active {
  color: #a52126;
}

.nav-center a.active::after {
  width: 100%;
}



/* === STORY HERO AUTO SCROLL STRIP === */


.story-slider {
  padding: 0 40px;     /* можно меньше */
}

/* сама лента */
.story-slider {
  height: 300px;
  display: flex;
  gap: 22px;

  overflow-x: auto;        /* ✅ разрешаем скролл */
  overflow-y: hidden;

  justify-content: flex-start; /* ✅ не центр */
  scroll-behavior: smooth;

  scrollbar-width: none;      /* Firefox */
}

.story-slider::-webkit-scrollbar {
  display: none;               /* Chrome / Safari */
}

/* картинки */
.story-slider img {
  width: 320px;          /* 🔥 фото крупнее */
  height: 240px;

  object-fit: cover;
  flex-shrink: 0;

  border-radius: 26px;   /* 🔥 скругление */
  
  /* 🔥 подсветка + объём */
  box-shadow:
    0 18px 30px rgba(0,0,0,0.18),
    0 6px 14px rgba(0,0,0,0.12);

  background: #f3eaea;
}

.story-slider img {
  opacity: 1 !important;
  position: relative !important;
}



/* =========================
   🍏 IMAGE LIGHTBOX
   ========================= */

.image-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}

.image-lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

.image-lightbox img {
  max-width: 80vw;
  max-height: 80vh;

  border-radius: 28px;
  box-shadow:
    0 40px 120px rgba(0,0,0,0.35);

  transform: scale(0.25);
  transition: transform .45s cubic-bezier(.2,.8,.2,1);
}


.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  width: 64px;
  height: 64px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,.14);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  color: white;
  font-size: 42px;
  line-height: 1;

  cursor: pointer;
  z-index: 10000;

  transition:
    transform .25s ease,
    background .25s ease;
}

.lightbox-arrow:hover {
  transform: translateY(-50%) scale(1.08);
  background: rgba(255,255,255,.22);
}

.lightbox-arrow.left {
  left: 38px;
}

.lightbox-arrow.right {
  right: 38px;
}

.lightbox-content {

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 18px;

  max-width: 90vw;
}

.lightbox-caption {

  width: 100%;
  max-width: 520px;
  box-sizing: border-box;


  padding: 16px 22px;

  border-radius: 22px;

  background: rgba(255,255,255,.16);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,.2);

  color: white;

  font-size: 17px;
  line-height: 1.6;
  text-align: left;

  text-shadow:
    0 2px 10px rgba(0,0,0,.45);

  box-shadow:
    0 12px 40px rgba(0,0,0,.22);

  opacity: 0;
  transform: translateY(10px);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.image-lightbox.active .lightbox-caption {

  opacity: 1;
  transform: translateY(0);
}



.image-lightbox.active img {
  transform: scale(1);
}

.story-hero img {
  cursor: zoom-in;
}

.image-lightbox img {

   📱 ORGANIC MOBILE STORY

function buildPublicUrl(bucket, path) {
  if (!path) return "";
  const trimmed = path.replace(/^\/+/, "");
  const parts = trimmed.split("/");

  if (parts.length === 1) {
    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(trimmed)}`;
  }

  const folder = parts.slice(0, -1).join("/");
  const filename = encodeURIComponent(parts.at(-1));
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${folder}/${filename}`;
}

function enableAutoScroll(row, speed = 0.25) {
  let stopped = false;

  function step() {
    if (!stopped) {
      row.scrollLeft += speed;
      if (row.scrollLeft + row.clientWidth >= row.scrollWidth - 1) {
        stopped = true;
      }
    }
    requestAnimationFrame(step);
  }

  function stop() {
    stopped = true;
  }

  row.addEventListener("mouseenter", stop);
  row.addEventListener("wheel", stop, { passive: true });
  row.addEventListener("touchstart", stop, { passive: true });
  row.addEventListener("mousedown", stop);

  requestAnimationFrame(step);
}

/* =========================================
   🍎 APPLE STYLE MARQUEE — FIXED
   ========================================= */

async function initStorySlider() {

  await loadStoryImageSlider();

  const track = document.getElementById("storyHeroImages");
  if (!track) return;

const hero = document.querySelector(".story-hero");
if (!hero) return;

  if (window.innerWidth <= 768) return;

  if (track.children.length < 2) return;

  // duplicate
const clone = track.cloneNode(true);

while (clone.firstChild) {
  track.appendChild(clone.firstChild);
}
  

// WAIT IMAGES
  const images = track.querySelectorAll("img");

  await Promise.all(
    [...images].map(img => {
      if (img.complete) return Promise.resolve();

      return new Promise(res => {
        img.onload = res;
        img.onerror = res;
      });
    })
  );


let y = 0;

  const speed = 0.25;

const marquee = track.closest(".story-marquee");

let isDragging = false;
let startY = 0;
let currentY = 0;

  function getSingleHeight() {
  return track.scrollHeight / 2;
}


function animate() {

if (document.hidden) {
  requestAnimationFrame(animate);
  return;
}


  if (!isDragging) {

    y -= speed;

  }

  if (Math.abs(y) >= getSingleHeight()) {
    y = 0;
  }

  track.style.transform =
    `translate3d(0, ${y}px, 0)`;

  requestAnimationFrame(animate);
}


  animate();

/* ===== MANUAL SCROLL ===== */

marquee.addEventListener("mousedown", e => {
  isDragging = true;
  startY = e.clientY;
});

window.addEventListener("mousemove", e => {

  if (!isDragging) return;

  const delta = e.clientY - startY;

  startY = e.clientY;

  y += delta;

  track.style.transform =
    `translate3d(0, ${y}px, 0)`;
});

window.addEventListener("mouseup", () => {
  isDragging = false;
});

/* TOUCH */

marquee.addEventListener("touchstart", e => {

  isDragging = true;
  startY = e.touches[0].clientY;

}, { passive: true });

marquee.addEventListener("touchmove", e => {

  if (!isDragging) return;

  const delta =
    e.touches[0].clientY - startY;

  startY = e.touches[0].clientY;

  y += delta;

  track.style.transform =
    `translate3d(0, ${y}px, 0)`;

}, { passive: true });

marquee.addEventListener("touchend", () => {

  isDragging = false;

});


}


</script>

<script>
async function loadStoryContent() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (!token) return;

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/our_story_page?select=how_we_met,growing_together,proposal,new_chapter,custom&edit_token=eq.${token}`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();
    if (!data || !data.length) return;

    const row = data[0];

    const fields = [
      "how_we_met",
      "growing_together",
      "proposal",
      "new_chapter",
      "custom"
    ];

fields.forEach(key => {
  const el = document.getElementById(key);
  if (!el) return;

  const card = el.closest(".story-card");

  const cleaned = (row[key] || "")
    .replace(/<p><br><\/p>/g, "")
    .replace(/<p>\s*<\/p>/g, "")
    .trim();

  if (cleaned) {
    el.innerHTML = cleaned;

    if (card) {
      card.style.display = "block";

      // 🔥 плавное появление БЕЗ вспышки
      card.style.opacity = "0";

      requestAnimationFrame(() => {
        card.style.transition = "all 0.4s ease";
        card.style.opacity = "1";
        card.style.transform = "translateY(0)";
      });
    }

  } else {
    if (card) card.style.display = "none";
  }
});

  } catch (e) {
    console.error("loadStoryContent error", e);
  }
}

</script>


<script>

function updateStoryHeroHeight() {

  const hero = document.querySelector(".story-hero");
  const header = document.querySelector("header");
  const footer = document.querySelector("#footer-mount");

  if (!hero || !header || !footer) return;

  const headerBottom =
    header.getBoundingClientRect().bottom + window.scrollY;

  const footerTop =
    footer.getBoundingClientRect().top + window.scrollY;

  const topOffset = 40;
  const bottomOffset = 40;

  const height =
    footerTop - headerBottom - topOffset - bottomOffset;

  hero.style.top =
    `${headerBottom + topOffset}px`;

  hero.style.height =
    `${height}px`;
}

function getToken() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (token) sessionStorage.setItem("rsvpToken", token);
  return token;
}

function buildLink(path) {
  const token = getToken();

  if (path === "home") {
    return `https://flowwed.netlify.app/index.html?t=${token}`;
  }

  if (!token) return path;
  return `${path}?t=${token}`;
}

document.querySelectorAll("[data-page]").forEach(link => {
  const page = link.dataset.page;
  link.href = buildLink(page);
});

function goBack() {
  history.length > 1 ? history.back() : window.location.href = buildLink("home");
}
</script>
