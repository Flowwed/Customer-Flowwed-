<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post Wedding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(to bottom, #fff7fa, #fdeff1, #f8dede);
  color: #732323;
}

header {
  text-align: center;
  padding: 50px 20px 30px;
  background: linear-gradient(to bottom, #fff, #f8dede);
  border-bottom: 1px solid rgba(255,255,255,.7);
}

h1 {
  color: #a52126;
  margin: 0 0 10px;
}

.subtitle {
  font-size: 17px;
  opacity: 0.9;
}

section {
  max-width: 720px;
  margin: auto;
  padding: 40px 20px 80px;
}

.form-card {
  background: rgba(255,255,255,0.7);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow:
    0 18px 40px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.8);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 20px;
}

.field label {
  font-weight: 600;
  color: #8b2020;
  font-size: 14px;
}

.field input,
.field textarea {
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(165,33,38,0.25);
  font-size: 15px;
  outline: none;
  background: #fff9fb;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}

.upload-box {
  border: 2px dashed rgba(165,33,38,0.35);
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  background: #fff6f8;
}

.upload-box p {
  margin: 0 0 10px;
  font-size: 14px;
  color: #8b2020;
}

.upload-box input {
  margin-top: 6px;
}

.submit-btn {
  margin-top: 26px;
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 18px;
  font-size: 18px;
  font-weight: 700;
  color: white;
  cursor: pointer;

  background: linear-gradient(135deg, #a52126, #7b1f22);
  box-shadow: 0 10px 26px rgba(0,0,0,0.25);
  transition: all .25s ease;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(0,0,0,0.35);
}

footer {
  margin-top: 60px;
  background: #fff5f5;
  padding: 24px;
  text-align: center;
  font-size: 14px;
  color: #a52126;
  border-top: 1px solid #ecdede;
}
</style>
</head>

<body>

<header>
  <h1>After the Wedding</h1>
  <div class="subtitle">
    Leave your message and share memories from our special day
  </div>
</header>

<section>
  <div class="form-card">

    <div class="field">
      <label>Name *</label>
      <input type="text" required placeholder="Your name">
    </div>

    <div class="field">
      <label>Surname *</label>
      <input type="text" required placeholder="Your surname">
    </div>

    <div class="field">
      <label>Email *</label>
      <input type="email" required placeholder="your@email.com">
    </div>

    <div class="field">
      <label>Your message</label>
      <textarea placeholder="Write a few warm words or share your memories..."></textarea>
    </div>

    <div class="upload-box">
      <p>Upload up to 10 photos (optional)</p>
      <input type="file" multiple accept="image/*">
    </div>

    <button class="submit-btn" disabled>
      Send
    </button>

  </div>
</section>

<footer>
  © Wedding Memories
</footer>

</body>
</html>
