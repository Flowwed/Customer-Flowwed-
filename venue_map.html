<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travel & Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fdeff1;
      color:#732323;
      line-height: 1.6;
    }

    header{
      text-align:center;
      padding:50px 10px;
      background:linear-gradient(to bottom, #fff, #f8dede);
      border-bottom:1px solid rgba(255,255,255,0.7);
    }

    h1,h2,h3{
      color:#a52126;
      margin-top:0;
    }



.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

.accordion{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.acc-item{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,0.1);
}

.acc-title{
  padding:16px;
  cursor:pointer;
  font-weight:600;
  background:#fff5f6;
}

.acc-content{
  max-height:0;
  overflow:hidden;
  transition:0.3s;
  padding:0 16px;
}

.acc-item.active .acc-content{
  max-height:1000px;
  padding:16px;
}

.timeline{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.timeline-item{
  display:flex;
  gap:12px;
  background:#fff5f6;
  padding:10px;
  border-radius:10px;
}

.timeline-time{
  font-weight:700;
  color:#a52126;
  min-width:80px;
}

.block{
  margin-bottom:14px;
}

.block b{
  display:block;
  margin-bottom:4px;
}

.link-item{
  display:block;
  margin:6px 0;
  padding:8px;
  border-radius:8px;
  background:#ffe5e8;
  text-decoration:none;
  color:#732323;
}


/* ===== WEDDING NAVBAR ===== */

.wedding-nav {
  position: sticky;
  top: 0;
  z-index: 999;

  display: flex;
  align-items: center;

  padding: 14px 28px;

  background: rgba(255, 245, 246, 0.82);
  backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(165, 33, 38, 0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.nav-left {
  margin-left: 40px;
}

.back-btn {
  background: linear-gradient(135deg, #a52126, #7b1f22);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;

  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  transition: all .25s ease;
}

.back-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.28);
}

.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 18px;
  white-space: nowrap;
}

.nav-center a {
  font-size: 15px;
  font-weight: 500;
  color: #732323;
  text-decoration: none;
  cursor: pointer;

  position: relative;
  padding-bottom: 4px;
}

.nav-center a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: #a52126;
  transition: width .3s ease;
}

.nav-center a:hover::after {
  width: 100%;
}

.nav-center a.active {
  color: #a52126;
}

.nav-center a.active::after {
  width: 100%;
}




</style>
</head>

<body>


<nav class="wedding-nav">
  <div class="nav-left">
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>

  <div class="nav-center">
    <a data-page="home">Home</a>
    <a data-page="photo_gallery.html">Photo Gallery</a>
    <a data-page="our_story.html">Our Story</a>
    <a data-page="web-updates.html">Updates</a>
    <a data-page="venue_map.html">Travel & Event</a>
    <a data-page="wed_party.html">Wedding Party</a>
    <a data-page="gift_registry.html">Gift Registry</a>
    <a data-page="just_married.html">Just Married</a>
  </div>
</nav>

  <!-- HEADER -->
  <header>
    <h1 id="coupleName" data-hidden></h1>
<div id="eventDate" style="margin-top:8px; font-size:18px; opacity:0.9; font-weight:500;" data-hidden></div>
    <p id="storySubtitle" data-hidden style="font-size:18px;">
  Get ready for the celebration ✨
</p>

  
</header>

<div class="container">

<div class="accordion">

<div class="acc-item active">
  <div class="acc-title">⏰ Schedule</div>
  <div class="acc-content" id="schedule"></div>
</div>

<div class="acc-item">
  <div class="acc-title">✈️ Travel & Stay</div>
  <div class="acc-content" id="travel"></div>
</div>

<div class="acc-item">
  <div class="acc-title">📍 Venue</div>
  <div class="acc-content" id="venue"></div>
</div>

<div class="acc-item">
  <div class="acc-title">📋 Details</div>
  <div class="acc-content" id="details"></div>
</div>

<div class="acc-item">
  <div class="acc-title">❓ FAQ</div>
  <div class="acc-content" id="faq"></div>
</div>

</div>

</div>

<script>
const SUPABASE_URL = "https://octwwpatppbenqwkcqaw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jdHd3cGF0cHBiZW5xd2tjcWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5NjYxMjYsImV4cCI6MjA3NDU0MjEyNn0.kYX1yCkx3Zl2J_qLHZYcknLnx_aXl26zB--__MzkknI"
;

function getToken(){
  const p = new URLSearchParams(location.search);
  return p.get("t") || "";
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global:{ headers:{ site_edit_token: getToken() } }
});


function parseLinks(text){
  if(!text) return "";

  return text.split("\n").map(line=>{
    let [name, link] = line.split("—");

    name = (name || "").trim();
    link = (link || "").trim();

    // если ссылки нет — используем name как ссылку
    if(!link && name.includes(".")){
      link = name;
    }

    // если нет http — добавляем
    if(link && !link.startsWith("http")){
      link = "https://" + link;
    }

    if(link){
      return `<a class="link-item" href="${link}" target="_blank">${name}</a>`;
    }

    return `<div class="link-item">${name}</div>`;
  }).join("");
}


async function loadData(){
  const token = getToken();
  if(!token) return;

  const { data } = await sb
    .from("wedding_info")
    .select("*")
    .eq("site_edit_token", token)
    .maybeSingle();

  if(!data) return;

  document.getElementById("coupleName").innerText =
    data.couple_name || "Wedding";

if (data.wedding_date) {
  const d = new Date(data.wedding_date);

  const formatted = d.toLocaleDateString("en-US", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });

  document.getElementById("eventDate").textContent = formatted;
}

  // SCHEDULE
  const scheduleEl = document.getElementById("schedule");

  if(data.schedule){
    scheduleEl.innerHTML = `
      <div class="timeline">
        ${data.schedule.map(i => `
          <div class="timeline-item">
            <div class="timeline-time">${i.time || ""}</div>
            <div>${i.text || ""}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  // TRAVEL
  document.getElementById("travel").innerHTML = `
    <div class="block"><b>Travel Notes</b>${data.flights_text || ""}</div>
    <div class="block"><b>Airport</b>${data.airport || ""}</div>
    <div class="block"><b>Transfer</b>${data.transfer_time || ""}</div>

    <div class="block"><b>Hotels</b>
      ${parseLinks(data.hotels)}
    </div>

    <div class="block"><b>Booking Platforms</b>
      ${parseLinks(data.stay_links)}
    </div>

    <div class="block"><b>Things To Do</b>
      ${data.things_to_do || ""}
    </div>
  `;

  // VENUE
  const mapLink = data.venue_address
    ? `https://maps.google.com/?q=${encodeURIComponent(data.venue_address)}`
    : "#";

  document.getElementById("venue").innerHTML = `
    <div class="block"><b>${data.venue_name || ""}</b></div>
    <div class="block">${data.venue_address || ""}</div>
    <div class="block">${data.venue_note || ""}</div>
    <a class="link-item" href="${mapLink}" target="_blank">Open map</a>
  `;

  // DETAILS
  document.getElementById("details").innerHTML = `
    <div class="block"><b>Dress Code</b>${data.dress_code || ""}</div>
    <div class="block"><b>Important Info</b>${data.important_info || ""}</div>
    <div class="block"><b>Weather</b>${parseLinks(data.weather_link)}</div>
  `;

// FAQ
const faqEl = document.getElementById("faq");
faqEl.innerHTML = "";

if (data.faq && data.faq.length) {

  faqEl.innerHTML = data.faq.map((f, i) => {
    const n = i + 1;

    return `
      <div class="faq-item">

        <div class="faq-question">
          <span>Q${n}. ${f.q || ""}</span>
          <span class="faq-arrow">›</span>
        </div>

        <div class="faq-answer">
          A${n}. ${f.a || ""}
        </div>

      </div>
    `;
  }).join("");

}
}

loadData();

// accordion

document.querySelectorAll(".acc-title").forEach(t=>{
  t.onclick = ()=>{
    const item = t.parentElement;

    // если уже открыт → закрываем
    if(item.classList.contains("active")){
      item.classList.remove("active");
      return;
    }

    // иначе: закрываем все и открываем нужный
    document.querySelectorAll(".acc-item").forEach(i=>i.classList.remove("active"));
    item.classList.add("active");
  };
});

</script>

<script>

function getToken() {
  const params = new URLSearchParams(location.search);
  return params.get("t") || "";
}

function buildLink(path) {
  const token = getToken();

  if (path === "home") {
    return `index.html?t=${token}`;
  }

  return `${path}?t=${token}`;
}

// проставляем ссылки
document.querySelectorAll("[data-page]").forEach(link => {
  const page = link.dataset.page;
  link.href = buildLink(page);
});

// кнопка BACK
function goBack() {
  if (history.length > 1) {
    history.back();
  } else {
    window.location.href = buildLink("home");
  }
}

(function setActiveNav() {
  let current = location.pathname.split("/").pop();
  current = current.replace(".html", "");

  document.querySelectorAll(".nav-center a").forEach(link => {
    let page = link.dataset.page || "";
    page = page.replace(".html", "");

    if (page === current) {
      link.classList.add("active");
    }
  });
})();


</script>

</body>
</html>
