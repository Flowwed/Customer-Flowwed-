<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just Married Album</title>
<link rel="stylesheet" href="/footer.css">

<meta name="viewport" content="width=1200, initial-scale=0.55, maximum-scale=0.55, user-scalable=no">

<style>
html,body{
  margin:0;
  background:radial-gradient(circle at top,#fff7f8,#e7c3cb);
  font-family:Inter,system-ui;
  color:#732323;
}

/* =========================
   NAVBAR (FROM SAMPLE 1:1)
   ========================= */
.wedding-nav{
  position:sticky;
  top:0;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 28px;
  background:rgba(255,245,246,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(165,33,38,.15);
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.nav-left{flex:0 0 auto;}

.back-btn{
  background:linear-gradient(135deg,#a52126,#7b1f22);
  color:#fff;
  border:none;
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.2);
}

.nav-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:18px;
  white-space:nowrap;
}

.nav-center a{
  font-size:15px;
  font-weight:500;
  color:#732323;
  text-decoration:none;
  position:relative;
  padding-bottom:4px;
}

.nav-center a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0%;
  height:2px;
  background:#a52126;
  transition:.3s;
}

.nav-center a:hover::after,
.nav-center a.active::after{width:100%;}

@media(max-width:1100px){
  .nav-center{
    position:static;
    transform:none;
    flex-wrap:wrap;
    justify-content:center;
    margin:10px auto 0;
  }
}

/* =========================
   HERO HEADER — COLLAPSE ON MUSIC (FIXED)
   ========================= */

.hero-header{
  text-align:center;
  padding:70px 12px 60px;
  background:linear-gradient(to bottom,#ffffff 0%,#f8dede 100%);
  border-bottom:none;

  overflow:hidden;

  /* фиксированная нормальная высота */
  max-height:420px;

  transition:
    max-height .75s cubic-bezier(.22,1,.36,1),
    padding .75s cubic-bezier(.22,1,.36,1),
    opacity .45s ease;
}

/* ⬇️ ПОСЛЕ СТАРТА МУЗЫКИ */
.hero-header.collapsed{
  max-height:64px;
  padding-top:8px;
  padding-bottom:8px;

  opacity:.15;
}
/* =========================
   ALBUM / STAGE (ORIGINAL)
   ========================= */
.album{
  position:relative;
  width:920px;
  padding:40px 56px 44px;
  margin: 0 auto;   /* ← ВОТ ЭТА СТРОКА */
  background:#f6f2ee;
  border-radius:32px;
  box-shadow:0 40px 110px rgba(110,15,30,.35);
}

.stage{ perspective:2200px; }

.page{
  position:relative;
  width:100%;
  height:520px;
  background:#fff;
  border-radius:26px;
  box-shadow:0 35px 80px rgba(0,0,0,.35);
  overflow:hidden;
}

.photo-grid{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
}

.photo{
  position:absolute;
  transform-style:preserve-3d;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:14px;
  opacity:.9;
}

.photo,
.photo img {
  overflow-anchor: none;
}


/* =========================
   VOLUME PANEL (ORIGINAL)
   ========================= */
.volume-panel{
  position:absolute;
  top:8px;
  right:10px;

  display:flex;
  align-items:center;
  gap:4px;              /* ↓ было 6 */

  height:24px;          /* ↓ было 26 */
  padding:0 6px;        /* ↓ было 9 */

  border-radius:999px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);

  box-shadow:0 4px 10px rgba(0,0,0,.14); /* чуть мягче */
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:10;
}

#volumeSlider{
  width:46px;
  height:2px;
}

#volumeBtn{
  font-size:13px;
  line-height:1;
}

.volume-panel.visible{
  opacity:1;
  pointer-events:auto;
}

.volume-panel{
  position:absolute;
  top:8px;
  right:26px;   /* ⬅️ край белого поля */
  left:auto;
}


/* =========================
   RIBBON (ORIGINAL)
   ========================= */
.ribbon-shell{
  width:1000px;
  margin:22px auto 0;
  position:relative;
  border-radius:18px;

  height:120px;        /* ← добавь это */
  overflow:hidden;     /* ← уже есть, оставляем */

  /* стеклянная подложка */
  background:
    linear-gradient(
      to bottom,
      rgba(255,246,248,.55),
      rgba(255,232,238,.35)
    );

  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
}

  /* ❌ УБРАЛИ border */

  /* мягкая, «парящая» тень */
  box-shadow:
    0 12px 40px rgba(120,30,50,.12),
    inset 0 1px 0 rgba(255,255,255,.35);

  /* поверхностная дымка */
  position:relative;
}

/* тонкая дымка поверх стекла */
.ribbon-shell::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.35),
      rgba(255,255,255,.05)
    );
  opacity:.35;
  pointer-events:none;
}

/* появление */
.ribbon-shell{
  opacity:0;
  transform:translateY(-16px);
  filter:blur(4px);
  transition:
    opacity .8s ease,
    transform .8s cubic-bezier(.22,1,.36,1),
    filter .8s ease;
}

.ribbon-shell.visible{
  opacity:1;
  transform:translateY(0);
  filter:blur(0);
}
.ribbon-track{
  display:flex;
  gap:18px;
  width:max-content;
  will-change:transform;
}

.ribbon-track img{
  width:100px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  cursor:zoom-in;
  box-shadow:0 12px 22px rgba(0,0,0,.18);
}

/* =========================
   LIGHTBOX (ORIGINAL)
   ========================= */
.image-lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.35s;
}

.image-lightbox.active{
  opacity:1;
  pointer-events:auto;
}

.image-lightbox img{
  display:block;
  max-width:100%;               /* ⬅️ теперь зависит от figure */
  max-height:70vh;
  border-radius:28px;
}

.lightbox-figure{
  display:inline-flex;          /* ⬅️ не растягивается */
  flex-direction:column;
  align-items:center;
  max-width:80vw;               /* ограничение по экрану */
}

.lightbox-caption{
  margin-top:14px;
  padding:14px 18px;

  color:#5a1c1c;
  font-size:15px;
  line-height:1.45;

  white-space: normal;     /* обычный поток текста */
  text-align: left;        /* НЕ center, НЕ justify */

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.92),
      rgba(255,245,248,.88)
    );

  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);

  border-radius:16px;

  box-shadow:
    0 18px 40px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.7);

  position: relative;
}

/* хвостик */
.lightbox-caption::after{
  content:"";
  position:absolute;
  top:-6px;                 /* хвост смотрит вверх к фото */
  left:50%;
  transform:translateX(-50%) rotate(45deg);

  width:14px;
  height:14px;

  background: inherit;
  box-shadow: inherit;
}

.lightbox-caption{
  white-space: normal !important;
}


.photo{
  pointer-events:auto;
}
.photo img{
  pointer-events:none;
}
.photo {
  will-change: transform;
  backface-visibility: hidden;
  contain: layout paint style;
}

/* =========================
   NAVBAR → VERTICAL (FINAL)
   ========================= */

.wedding-nav{
  transition:
    transform .6s ease,
    opacity .6s ease;
}

/* после запуска музыки */
.wedding-nav.vertical{
  position:fixed;
  top:0;
  left:0;
  bottom:0;

  width:140px;              /* УЗКИЙ */
  padding:18px 14px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:14px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,245,247,.75),
      rgba(255,230,235,.55)
    );

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    6px 0 30px rgba(120,30,50,.18);

  z-index:998;
}

/* центрируем меню вертикально */
.wedding-nav.vertical .nav-center{
  position:static;
  transform:none;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* кнопка Back сверху */
.wedding-nav.vertical .nav-left{
  margin-bottom:18px;
}

/* =========================
   BACK BUTTON — RIGHT OFFSET (HORIZONTAL)
   ========================= */

.wedding-nav:not(.vertical) .nav-left{
  margin-left:40px;   /* 👈 как в образце */
}


/* =========================
   VERTICAL NAVBAR — CLEAN
   ========================= */

/* полностью убираем контент */
.wedding-nav.vertical .nav-left,
.wedding-nav.vertical .nav-center{
  display:none;
}

/* делаем его узким и немешащим */
.wedding-nav.vertical{
  width:64px;              /* можно 48–72 */
  padding:0;
}

/* =========================
   NAVBAR EQUALIZER (HIDDEN)
   ========================= */

.nav-eq {
  display: none; /* ⛔ скрыт по умолчанию */

  width: 28px;
  height: 2044px;

  margin: 18px auto 0;

  align-items: flex-end;
  justify-content: space-between;

  padding: 8px 6px;

  background: rgba(255,255,255,0.55);
  border-radius: 14px;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.18),
    inset 0 0 6px rgba(255,255,255,0.6);

  backdrop-filter: blur(12px) saturate(150%);
}

/* bars */
.nav-eq span {
  width: 3px;
  height: 60%;
  border-radius: 3px;

  background: linear-gradient(
    to top,
    #6a0f0f,
    #b41111,
    #ffb3b3
  );

  transform-origin: bottom;
  transition: transform 0.08s linear, opacity 0.08s linear;}

/* offsets */
.nav-eq span:nth-child(2){ animation-delay:.3s }
.nav-eq span:nth-child(3){ animation-delay:.6s }
.nav-eq span:nth-child(4){ animation-delay:.2s }
.nav-eq span:nth-child(5){ animation-delay:.5s }

/* animation */
@keyframes navEqIdle {
  0%   { transform: scaleY(0.25); opacity:.6 }
  30%  { transform: scaleY(0.8);  opacity:.9 }
  60%  { transform: scaleY(0.45); opacity:.7 }
  100% { transform: scaleY(0.3);  opacity:.6 }
}

.nav-eq span {
  transition:
    transform 0.05s cubic-bezier(.22,1,.36,1),
    opacity 0.1s ease;
}

.nav-eq span {
  box-shadow:
    0 0 6px rgba(255,120,120,.25);
  transition:
    transform 0.05s cubic-bezier(.22,1,.36,1),
    opacity 0.1s ease,
    box-shadow 0.15s ease;
}


/* =========================
   SHOW EQ ONLY IN VERTICAL
   ========================= */

.wedding-nav.vertical .nav-eq {
  display: flex;
}

/* =========================
   INFO BALLOONS (APPLE STYLE)
   ========================= */
.info-balloons{
  position:fixed;
  top:120px;
  right:38px;
  transform: translateX(16px);  /* ← сдвиг вправо */

  display:flex;
  flex-direction:column;
  gap:14px;

  align-items:flex-end;  /* ← ключевая строка */


  pointer-events:none;
  z-index:20;
}
.info-balloon{
  position:relative;
  padding:14px 16px;
  border-radius:18px;
  font-size:14px;
  line-height:1.35;
  color:#5a1c1c;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.75),
      rgba(255,245,248,.55)
    );

  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);

  box-shadow:
    0 18px 40px rgba(120,30,50,.18),
    inset 0 1px 0 rgba(255,255,255,.6);

  opacity:0;
  transform:translateY(12px) scale(.96);
  filter:blur(6px);

  /* ТОЛЬКО появление */
  animation: balloonIn .7s cubic-bezier(.22,1,.36,1) forwards;
}

.info-balloon{
  min-width: 180px;   /* комфортная ширина */
  max-width: 220px;   /* чтобы не разрастались */
}

.info-balloons.intro-group{
  gap: 32px;   /* нужный тебе интервал */
}

.play-highlight{
  font-weight:700;
  color:#a52126;
}

.play-trigger{
  cursor:pointer;
  pointer-events:auto;
}



/* хвостик */
.info-balloon::after{
  content:"";
  position:absolute;
  right:-6px;
  top:18px;
  width:14px;
  height:14px;
  background:inherit;
  transform:rotate(45deg);
  filter:blur(.2px);
}

/* анимации */
@keyframes balloonIn{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

/* ⬅️ ВОССТАНОВЛЕННЫЙ КРАСИВЫЙ УХОД */
@keyframes balloonOut{
  0%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
  35%{
    opacity:1;
    transform:translateY(-2px) scale(.99);
    filter:blur(3px);
  }
  100%{
    opacity:0;
    transform:translateY(-12px) scale(.96);
    filter:blur(8px);
  }
}

/* ⬅️ ОДНОВРЕМЕННОЕ исчезновение */
.info-balloons.hide-all .info-balloon{
  animation: balloonOut .7s cubic-bezier(.55,0,.85,.4) forwards;
}

/* =========================
   RIBBON — VERTICAL LEFT
   ========================= */
.ribbon-shell.vertical-left{
  position:fixed;
  top:0;
  left:64px;

  width:140px;
  height:100vh;

  overflow:hidden;     /* физическое окно */
  z-index:5;
}

/* трек исключаем из потока */
.ribbon-shell.vertical-left .ribbon-track{
  position:absolute;
  top:0;
  left:0;

  width:100%;              /* занимает всю ширину окна */
  display:flex;
  flex-direction:column;
  align-items:center;      /* центрирует фото по горизонтали */
}

/* =========================
   VERTICAL MODE HAMBURGER
   ========================= */

.vertical-menu-btn{
  position:fixed;
  top:22px;
  right:26px;          /* ← органичный "воздух" */

  width:30px;
  height:22px;

  display:none;        /* ⛔ скрыта по умолчанию */
  flex-direction:column;
  justify-content:space-between;

  cursor:pointer;
  z-index:1200;
}

.vertical-menu-btn span{
  height:3px;
  border-radius:3px;
  background:#732323;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

/* ⬅️ ПОЯВЛЯЕТСЯ ТОЛЬКО КОГДА NAVBAR СТАЛ VERTICAL */
.wedding-nav.vertical ~ .vertical-menu-btn{
  display:flex;
}


/* =========================
   VERTICAL MODE DROPDOWN — iOS SHEET
   ========================= */

.vertical-menu-dropdown{
  position:fixed;
  top:64px;
  right:26px;

  width:220px;
  max-width:calc(100vw - 48px);


  padding:14px 18px 22px;

  /* iOS glass */
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.92),
      rgba(255,245,248,.88)
    );

  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);

  /* iOS sheet corners */
  border-radius:18px 18px 30px 30px;

  box-shadow:
    0 32px 90px rgba(120,30,50,.35),
    inset 0 1px 0 rgba(255,255,255,.65);

  /* hidden state */
  opacity:0;
  transform:translateY(-14px) scale(.97);
  pointer-events:none;

  transition:
    opacity .32s ease,
    transform .38s cubic-bezier(.22,1,.36,1);

  z-index:1200;
}

.vertical-menu-dropdown.open{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}

.vertical-menu-dropdown .nav-center{
  display:flex;
  flex-direction:column;
  gap:14px;

  position:static;
  transform:none;
}


.vertical-menu-dropdown .nav-center a{
  font-size:16px;
  font-weight:500;

  color:#732323;
  text-decoration:none;

  padding:6px 0;
}

.vertical-menu-dropdown .nav-left{
  margin-bottom:14px;
}

.vertical-menu-dropdown .back-btn{
  width:100%;

  background:none;
  box-shadow:none;
  border:none;

  padding:6px 0;

  font-size:16px;
  font-weight:500;
  color:#732323;

  cursor:pointer;
  border-radius:0;
}

.vertical-menu-dropdown .nav-left::after{
  content:"";
  display:block;
  height:1px;
  margin-top:12px;

  background:rgba(165,33,38,.12);
}


/* =========================
   iOS ACTIVE ITEM — DROPDOWN
   ========================= */

.vertical-menu-dropdown .nav-center a.active,
.vertical-menu-dropdown .back-btn.active{
  color:#a52126;
  font-weight:600;
}

/* мягкая iOS-подложка при active */
.vertical-menu-dropdown .nav-center a.active::before{
  content:"";
  position:absolute;
  left:-10px;
  right:-10px;
  top:-4px;
  bottom:-4px;

  background:rgba(165,33,38,.08);
  border-radius:10px;
  z-index:-1;
}

/* убираем underline в dropdown */
.vertical-menu-dropdown .nav-center a::after{
  display:none;
}


/* =========================
   PAGINATION — ROUND BUTTONS
   ========================= */

#pagination {
  position: absolute;

  left: 50%;
  bottom: 10px;              /* ⬅️ ЭТО ТВОЙ РЕГУЛЯТОР */

  transform: translateX(-50%);

  display: flex;
  gap: 12px;

  z-index: 20;
}

#pagination a {
  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;               /* 🔵 круг */
  text-decoration: none;

  font-size: 10px;
  font-weight: 500;

  color: #732323;
  background: linear-gradient(
    to bottom,
    #ffffff,
    #f6e3e6
  );

  box-shadow:
    0 4px 10px rgba(120,30,50,.18),
    inset 0 1px 0 rgba(255,255,255,.8);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

/* hover */
#pagination a:hover {
  transform: translateY(-1px);
  box-shadow:
    0 6px 14px rgba(120,30,50,.25),
    inset 0 1px 0 rgba(255,255,255,.9);
}

/* active page */
#pagination a.active {
  background: linear-gradient(
    to bottom,
    #a52126,
    #7b1f22
  );

  color: #fff;

  box-shadow:
    0 6px 18px rgba(120,30,50,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
}


body.special-mode .nav-left,
body.special-mode .nav-center,
body.special-mode .vertical-menu-btn,
body.special-mode #pagination {
  display: none !important;
}


/* кликабельные элементы — курсор "рука" */
.photo,
.photo * {
  cursor: pointer;
}

.ribbon-track img {
  cursor: pointer;
}

.nav-center a,
.back-btn,
#playBtn,
#muteBtn,
#pagination a,
.vertical-menu-btn {
  cursor: pointer;
}

#volumeSlider {
  cursor: pointer;
}

#volumeSlider:active {
  cursor: grabbing;
}

#volumeSlider::-webkit-slider-thumb {
  cursor: grab;
}

#volumeSlider::-webkit-slider-thumb:active {
  cursor: grabbing;
}
.speaker-btn{
  position:absolute;
  top:8px;
  right:90px;              /* тот же край, что у панели */
  transform: translateX(-100%);  /* уводим влево ровно на свою ширину */
  margin-right: 8px;       /* маленький зазор от панели */

  width:24px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);

  box-shadow:0 4px 10px rgba(0,0,0,.14);
  cursor:pointer;

  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:11;
}

.volume-panel.visible ~ .speaker-btn,
.speaker-btn.visible{
  opacity:1;
  pointer-events:auto;
}

/* =========================
   GLASS LOADING OVERLAY
   ========================= */

#loadingOverlay{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      to bottom,
      rgba(255,240,245,.65),
      rgba(255,220,230,.55)
    );

  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);

  z-index:99999;

  opacity:1;
  transition: opacity .5s ease;
}

#loadingOverlay.hide{
  opacity:0;
  pointer-events:none;
}

/* spinner */

.loader{
  width:56px;
  height:56px;

  wrap.depth = Math.random();

  wrap.appendChild(img);

const bgMusic=document.getElementById("bgMusic");
let audioCtx, analyser, data, audioActive=false;
let justStarted = false;


function initAudio(){
  if (audioActive) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  data = new Uint8Array(analyser.frequencyBinCount);

  // 🔑 ВАЖНО: подключаем ПОСЛЕ src
  const srcNode = audioCtx.createMediaElementSource(bgMusic);
  srcNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  audioActive = true;
}

let accent = -1, accentP = 0, lastA = 0;

let lastTime = 0;
const FRAME = 1000 / 30;

function animate(t){
  requestAnimationFrame(animate);

  if (document.hidden) return;

  if (t - lastTime < FRAME) return;
  lastTime = t;

let bp = 0, mp = 0;

if(audioActive && analyser){
  analyser.getByteFrequencyData(data);

  let bass = 0, mid = 0;
  for(let i=0;i<12;i++) bass += data[i];
  for(let i=20;i<50;i++) mid += data[i];

  bp = bass / 12 / 255;
  mp = mid / 30 / 255;
}

  const now = performance.now();
  if(audioActive && mp > 0.55 && now - lastA > 320){
  accent = Math.floor(Math.random() * cards.length);
  accentP = 1;
  lastA = now;
}


  cards.forEach((c,i)=>{
    c.phase += audioActive ? (0.01 + mp * 0.015) : 0.009;


    const sway = audioActive ? (22 + mp * 28) : 14;
    const x = Math.sin(c.phase + i) * sway;
    const y = Math.cos(c.phase * 0.7 + i) * sway * 0.7;

    let scale = audioActive ? (1 + bp * 0.4) : 1;
    let z = audioActive ? (bp * c.depth * 40) : 0;

    if(audioActive && i === accent){
      scale += accentP * 0.9;
      z += accentP * 220;
    }

    c.style.transform =
      `translate3d(${x}px,${y}px,${z}px) scale(${scale})`;
  });

  accentP *= 0.88;

// ===== NAVBAR EQ + PEAK + GLOW + ACCENT =====

if (audioActive && analyser && eqBars.length) {

  const now = performance.now();

  eqBars.forEach((bar, i) => {

    /* =========================
       1️⃣ ЧАСТОТНЫЙ ДИАПАЗОН
       ========================= */
    const index =
      i === 0 ? 2  :
      i === 1 ? 6  :
      i === 2 ? 14 :
      i === 3 ? 30 :
                50;

    const raw = data[index] / 255;

bar._v = bar._v ?? raw;
bar._v += (raw - bar._v) * 0.15;

let v = bar._v;


    if (i < 2) v *= 1.5; // бас усилен


 

    /* =========================
       3️⃣ LEVEL (attack / decay)
       ========================= */
    const target = 0.15 + v * 1.2;
    const speed = target > bar._level ? 0.28 : 0.08;

    bar._level += (target - bar._level) * speed;


    /* =========================
       4️⃣ PEAK HOLD (200ms)
       ========================= */
    if (bar._level > bar._peak) {
      bar._peak = bar._level;
      bar._peakTime = now;
    } else if (now - bar._peakTime > 200) {
      bar._peak *= 0.965;

    }

    let scale = Math.min(0.9, bar._peak);



    /* =========================
       5️⃣ 🧠 ACCENT SYNC
       ПЕРЕД transform
       ========================= */
 if (audioActive && accentP > 0.1) {
  scale *= 1 + accentP * 0.15;
      bar.style.boxShadow =
        `0 0 ${18 + accentP * 30}px rgba(255,140,140,${0.6 + accentP})`;
    }


    /* =========================
       7️⃣ 🎲 MICRO JITTER
       САМЫЙ КОНЕЦ
       ========================= */
const breathe = 1 + Math.sin(now * 0.004 + i) * 0.015;
bar.style.transform = `scaleY(${scale * breathe})`;


    bar.style.opacity = 0.4 + scale * 0.6;
  });
}
}

const ready =

    el.className = "info-balloon";

    // ❌ убираем анимацию
    el.style.animation = "none";
    el.style.opacity = "1";
    el.style.transform = "none";
    el.style.filter = "none";

    el.innerHTML = text;

    root.appendChild(el);
  });

  // 🔥 считаем intro уже показанным
  pointer = 0;
  introDone = true;
introFinished = true;

}

function spawnGroup(){
if (groupActive) return; // 🔥 ВОТ ЭТО КРИТИЧНО

  groupActive = true;

  const shown = new Set();   // ← ДОБАВИТЬ ЭТУ СТРОКУ

  const isIntro = !introDone;
  let introCount = 0;

  // 🔑 ТОЛЬКО ДЛЯ ПЕРВОГО БЛОКА
  if (isIntro) {
    balloonsRoot.classList.add("intro-group");
  } else {
    balloonsRoot.classList.remove("intro-group");
  }

  layoutBalloons();
  balloonsRoot.classList.remove("hide-all");
  balloonsRoot.innerHTML = "";

  const freeHeight = getFreeHeight();

  let holdTimer = null;

function scheduleHold(){

  // ⛔ если это intro и ещё не нажали play — НЕ запускаем таймер
  if (!started && !introFinished) return;

  clearTimeout(holdTimer);
  holdTimer = setTimeout(clearGroup, HOLD_AFTER);
}

function spawnOne(){
  let text = "";

  while (true) {
    text = getNextText();
    if (!text) break;
    if (!shown.has(text)) break;
  }


if (!text) {

  // 🔥 если ещё идёт intro — НЕ останавливаемся
  if (!introDone) {
    setTimeout(spawnOne, APPEAR_GAP);
    return;
  }

  scheduleHold();
  return;
}

   const el = document.createElement("div");
el.className = "info-balloon";
el.innerHTML = text;
balloonsRoot.appendChild(el);

const trigger = el.querySelector(".play-trigger");

if(trigger){
  trigger.addEventListener("click", () => {
    document.getElementById("playBtn")?.click();
  });
}


shown.add(text);   // ← ДОБАВИТЬ
;

if (isIntro) {
  introCount++;

  // ⛔ только 6 и точка
  if (introCount >= INTRO_LIMIT) {
    introFinished = true; // 🔥 ДОБАВЬ ЭТУ СТРОКУ

// ⛔ НЕ удаляем — ждём play
  if (!started) return;

    scheduleHold();
    return;
  }

} else {
      // обычный режим — проверка по высоте
   if (balloonsRoot.scrollHeight > freeHeight) {
  balloonsRoot.removeChild(el);
  captionIndex--;        // ⬅️ откатываем — это сообщение ещё не показано
  scheduleHold();
  return;
}

    }

    scheduleHold();
    setTimeout(spawnOne, APPEAR_GAP);
  }

function clearGroup(){

// ⛔ если ещё не нажали play — НИЧЕГО НЕ ЧИСТИМ
if (!started) return;

  // 🔒 СПЕЦ-РЕЖИМ: НИКОГДА НЕ ОЧИЩАЕМ BALLOONS
  if (window.__SPECIAL_MODE__) {
    return;
  }

  balloonsRoot.classList.add("hide-all");

setTimeout(() => {
  balloonsRoot.innerHTML = "";
  groupActive = false;
  requestLayout();

  // ⛔ если intro закончился И captions тоже — больше не стартуем
if (window.captionBalloons && captionIndex >= window.captionBalloons.length) {
  captionIndex = 0;   // 🔁 начинаем сначала
}
  setTimeout(spawnGroup, AFTER_CLEAR);
}, 700);
}

  spawnOne();
}


</script>
