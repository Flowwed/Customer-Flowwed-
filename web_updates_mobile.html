/* ====== STORY CARDS ====== */

section {
  max-width: 1100px;
  margin: 20px auto;        /* 👈 было 60px → стало компактно */
  padding: 30px 30px;       /* 👈 было 60px → стало аккуратно */

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff7f8 100%
  );

  border-radius: 28px;

  box-shadow:
    0 30px 60px rgba(0, 0, 0, 0.18),
    0 12px 24px rgba(0, 0, 0, 0.10);

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;
}
/* заголовки внутри карточек */
section h2 {
  font-size: 32px;
  margin-bottom: 18px;
  color: #a52126;
}

/* текст */
section p {
  font-size: 18px;
  line-height: 1.75;
  color: #6f2a2a;
  margin-bottom: 40px;
}

/* последнее описание — без лишнего отступа */
section p:last-child {
  margin-bottom: 0;
}

section {
  animation: fadeUp 0.9s ease both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}



/* контейнер */
section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
  
}

/* ====== ОТДЕЛЬНАЯ КАРТОЧКА ====== */
.story-card {
  margin-top: 20px;
  padding: 50px 60px;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff6f7 100%
  );

  border-radius: 30px;

  box-shadow:
    0 28px 60px rgba(0, 0, 0, 0.18),
    0 12px 24px rgba(0, 0, 0, 0.10);

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;
}

/* эффект парения */
.story-card:hover {
  transform: none;
  box-shadow:
    0 45px 90px rgba(0, 0, 0, 0.22),
    0 18px 36px rgba(0, 0, 0, 0.14);
}

/* заголовок */
.story-card h2 {
  font-size: 28px;
font-weight: 650;
  margin-bottom: 18px;
  color: #a52126;
}

/* текст */
.story-card p {
  font-size: 18px;
  line-height: 1.75;
  color: #6f2a2a;
}

.updates-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;

  padding-top: 16px;     /* 👆 сверху меньше */
  padding-left: 24px;
  padding-right: 24px;
  padding-bottom: 16px;   /* 👇 НИЗ СИЛЬНО МЕНЬШЕ */

  background: #fff;
}

.updates-grid img {
  width: 100%;
  max-height:420px;                 /* 🔥 важно */
  object-fit: cover;
  border-radius: 28px;
}

/* ===== TEXTAREA-LIKE MODE FOR STORY ===== */
.story-card p {
  margin: 0;               /* ❗ убираем ВСЕ отступы */
  padding: 0;
  line-height: 1.35;       /* как textarea */
}

/* Quill иногда вставляет пустые <p><br></p> */
.story-card p:empty {
  display: none;
}

/* если внутри Quill есть <br> */
.story-card br {
  display: block;
  content: "";
  margin-top: 0;
}

[data-visible] {
  visibility: visible;
}


@media (max-width: 900px) {

  section {
    padding: 20px !important;
  }

  .story-card {
    padding: 24px !important;
  }

  .updates-grid {
    padding-left: 12px !important;
    padding-right: 12px !important;
  }

  .story-hero img {

}


@media (max-width: 900px) {

  .story-hero {

    border-radius: 24px;
  }

    width: 100%;
    height: 200px;            /* не vh, фикс */

}

/* =========================
   GLASS LOADING OVERLAY
   ========================= */

#loadingOverlay {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      to bottom,
      rgba(255,240,245,.65),
      rgba(255,220,230,.55)
    );

  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);

  z-index: 999999;

  opacity: 1;
  transition: opacity .45s ease;
}

#loadingOverlay.hide {
  opacity: 0;
  pointer-events: none;
}

/* spinner */
.loader {
  width: 56px;
  height: 56px;

  border-radius: 50%;
  border: 4px solid rgba(165,33,38,.15);
  border-top: 4px solid #a52126;

  animation: spin .9s linear infinite;

  box-shadow:
    0 0 30px rgba(165,33,38,.35);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}


.loading-content {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.loading-text {
  margin-top: 16px;

}

  if (!path) return "";
  const trimmed = path.replace(/^\/+/, "");
  const parts = trimmed.split("/");

    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(trimmed)}`;

<script>
async function loadStoryContent() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (!token) return;

  try {
    const res = await fetch(
        `${SUPABASE_URL}/rest/v1/our_story_page?select=wed_updates&edit_token=eq.${token}`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

const data = await res.json();
if (!data || !data.length) return;

const row = data[0];
const el = document.getElementById("how_we_met");

if (!row.wed_updates || row.wed_updates.length === 0) {

  el.innerHTML = `

      No updates have been posted yet.
    </p>

    <p style="text-align:center;">
      Any news, schedule changes, travel information, or reminders shared by the couple will appear here.
    </p>
  `;

  return;
}


if (el && Array.isArray(row.wed_updates)) {

  row.wed_updates.forEach(u => {

    });

html += `

`;  

});

  el.innerHTML = html;
}
  } catch (e) {

  }
}


</script>


<script>
function getToken() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (token) sessionStorage.setItem("rsvpToken", token);
  return token;
}

function buildLink(path) {
  const token = getToken();

  if (path === "home") {
    return `https://flowwed.netlify.app/index.html?t=${token}`;
  }

  if (!token) return path;
  return `${path}?t=${token}`;
}

document.querySelectorAll("[data-page]").forEach(link => {
  const page = link.dataset.page;
  link.href = buildLink(page);
});

function goBack() {
  history.length > 1 ? history.back() : window.location.href = buildLink("home");
}
</script>

<script>

(function setActiveNav() {
  let current = location.pathname.split("/").pop();

  // Netlify: /photo_gallery → photo_gallery
  // Local: photo_gallery.html → photo_gallery
  current = current.replace(".html", "");

  document.querySelectorAll(".nav-center a").forEach(link => {
    let page = link.dataset.page || "";

    // приводим data-page к такому же виду
    page = page.replace(".html", "");

    if (page === current) {
      link.classList.add("active");
    }
  });
})();

</script>
