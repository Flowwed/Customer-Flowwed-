<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<link rel="stylesheet" href="/footer.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
  margin:0;
  padding:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:#fdeff1;
  color:#732323;
}

header{
  text-align:center;
  padding:50px 10px;
  background:linear-gradient(to bottom,#fff,#f8dede);
  border-bottom:1px solid rgba(255,255,255,.7);
}


 h1,h2,h3{
      color:#a52126;
      margin-top:0;
    }


section{
  max-width:1200px;
  margin:auto;
  padding:40px 20px 80px;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:24px;
  grid-auto-rows:200px;
position: relative;   /* ← ВОТ ЭТО ДОБАВЬ */
}

.ribbon-glass{
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);

  width: 88%;
  height: 100%;

  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.45),
    rgba(255,245,248,.35)
  );

  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);

  border-radius: 22px;

  box-shadow:
    0 18px 50px rgba(120,30,50,.18),
    inset 0 1px 0 rgba(255,255,255,.45);

  pointer-events: none;
  z-index: 0;
}

.gallery-grid > .photo-item{
  position: relative;
  z-index: 1;
}


.photo-item{
  position:relative;
  cursor:pointer;
  opacity:0;
  animation:fadeIn 1.3s ease forwards;
  perspective:1200px; /* 3D */
}

.photo-item.big{
  grid-column:span 2;
  grid-row:span 2;
}

.photo-item.tall{
  grid-row:span 2;
}

/* внутренний контейнер для вращения */
.photo-item-inner{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 8s ease-out;
}

/* действие при наведении */
.photo-item:hover .photo-item-inner{
  transform:rotateY(360deg);
}

.photo-item img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:16px;

  backface-visibility:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.22);
}

/* задняя сторона та же картинка */
.photo-item img.back{
  transform:rotateY(180deg);
}


/* стеклянный блик */
.photo-item img::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  pointer-events:none;

  background:linear-gradient(
      120deg,
      rgba(255,255,255,.25) 0%,
      rgba(255,255,255,0) 60%
  );

  opacity:0;
  transition:opacity .8s ease;
}

/* при наведении — проявляется */
.photo-item:hover img::after{
  opacity:.6;
}


.photo-number{
  position:absolute;
  top:6px;
  right:10px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:12px;
  padding:2px 6px;
  border-radius:8px;
  pointer-events:none;
  font-weight:bold;
  z-index:99;
}

.caption-text{
  text-align:center;
  margin-top:8px;
  font-size:15px;
  opacity:.9;
  color:#8b2020;
}


@keyframes fadeIn{
  from{opacity:0; transform:scale(.96);}
  to{opacity:1; transform:scale(1);}
}

#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#lightImg{
  max-width:92vw;
  max-height:92vh;
  border-radius:14px;
  transition:transform .45s ease,opacity .35s ease;
  transform:scale(.88);
  opacity:0;
}

#lightbox.show #lightImg{
  transform:scale(1);
  opacity:1;
}

.arrow-btn{
  z-index: 10001;
  position: fixed;   /* 🔥 важно */  top:50%;
  transform:translateY(-50%);

  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
  color:white;

  background:rgba(0,0,0,.45);     /* 🔥 подложка */
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  border-radius:50%;
  border:none;
  cursor:pointer;

  box-shadow:0 8px 22px rgba(0,0,0,.35);
  transition:all .2s ease;
}

.arrow-btn:hover{
  background:rgba(0,0,0,.65);
  transform:translateY(-50%) scale(1.06);
}

#prevBtn{left:35px;}
#nextBtn{right:35px;}

/* ===== WEDDING NAVBAR ===== */

.wedding-nav {
  position: sticky;
  top: 0;
  z-index: 999;

  display: flex;
  align-items: center;

  padding: 14px 28px;

  background: rgba(255, 245, 246, 0.82);
  backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(165, 33, 38, 0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.nav-left {
  position: relative;
  z-index: 2;
  margin-left: 40px; /* 👈 ВОТ ОНО */
}

/* BACK BUTTON — без изменений */
.back-btn {
  background: linear-gradient(135deg, #a52126, #7b1f22);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;

  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  transition: all .25s ease;
}

.back-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.28);
}

/* 🔥 ЦЕНТР СТРАНИЦЫ */
.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 18px;
  white-space: nowrap;
}
.nav-center a {
  font-size: 15px;
  font-weight: 500;
  color: #732323;
  text-decoration: none;
  cursor: pointer;

  position: relative;
  padding-bottom: 4px;
}

.nav-center a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: #a52126;
  transition: width .3s ease;
}

.nav-center a:hover::after {
  width: 100%;
}

.nav-center a.active {
  color: #a52126;
}

.nav-center a.active::after {
  width: 100%;
}



/* =========================
   📱 MOBILE OPTIMIZATION
   ========================= */

@media (max-width: 768px) {

  header {
    padding: 30px 12px;
  }

  header h1 {
    font-size: 28px;
  }

  header p {
    font-size: 16px;
  }

  section {
    padding: 25px 12px 60px;
  }

  /* 📸 Галерея */
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    grid-auto-rows: 160px;
  }

  .photo-item.big,
  .photo-item.tall {
    grid-column: span 1;
    grid-row: span 1;
  }

  .photo-item {
    animation: none;
  }

  /* ❌ убираем 3D hover */
  .photo-item-inner {
    transition: none;
  }

  .photo-item:hover .photo-item-inner {
    transform: none;
  }

  .photo-item img {
    border-radius: 12px;
  }

  .caption-text {
    font-size: 13px;
  }

  .photo-number {
    font-size: 11px;
    padding: 1px 5px;
  }

  /* 💡 Lightbox */
  .arrow-btn {
    font-size: 36px;
  }

  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }

  #lightImg {
    max-width: 96vw;
    max-height: 86vh;
  }

  /* 🧭 NAVBAR */
  .wedding-nav {
    padding: 10px 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-left {
    margin-left: 0;
  }

  .back-btn {
    font-size: 13px;
    padding: 8px 14px;
  }

  .nav-center {
    gap: 10px;
  }

  .nav-center a {
    font-size: 13px;
  }
}

/* 📱 Очень маленькие экраны */
@media (max-width: 420px) {
  .gallery-grid {
    grid-template-columns: 1fr;
    grid-auto-rows: 200px;
  }
}

/* 📱 MOBILE FIX: force show photos */
@media (max-width: 768px) {
  .photo-item {
    opacity: 1 !important;
    animation: none !important;
    transform: none !important;
  }
}

/* =========================
   📱 MOBILE HAMBURGER MENU — 1:1 SAMPLE
   ========================= */

@media (max-width: 900px) {

  /* скрываем desktop */
  .wedding-nav > .nav-center,
  .wedding-nav > .nav-left {
    display: none !important;
  }

  /* ☰ кнопка */
  .vertical-menu-btn {
    position: fixed;
    top: 22px;
    right: 26px;

    width: 30px;
    height: 22px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    cursor: pointer;
    z-index: 1200;
  }

  .vertical-menu-btn span {
    height: 3px;
    border-radius: 3px;
    background: #732323;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  /* dropdown sheet */
  .vertical-menu-dropdown {
    position: fixed;
    top: 64px;
    right: 26px;

    width: 240px;
    max-width: calc(100vw - 52px);

    padding: 14px 18px 22px;

    background:
      linear-gradient(
        to bottom,
        rgba(255,255,255,.92),
        rgba(255,245,248,.88)
      );

    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);

    border-radius: 18px 18px 30px 30px;

    box-shadow:
      0 32px 90px rgba(120,30,50,.35),
      inset 0 1px 0 rgba(255,255,255,.65);

    /* hidden */
    opacity: 0;
    transform: translateY(-14px) scale(.97);
    pointer-events: none;

    transition:
      opacity .32s ease,
      transform .38s cubic-bezier(.22,1,.36,1);

    z-index: 1200;

    /* ⬅️ ключ: ощущение "длинного" sheet */
    max-height: calc(100vh - 96px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .vertical-menu-dropdown.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ===== BACK SECTION (как в образце) ===== */

  .vertical-menu-dropdown .mobile-back {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont;
    font-size: 16px;
    font-weight: 500;

    color: #732323;

    padding: 6px 0 14px;
    margin-bottom: 14px;

    cursor: pointer;
  }

  /* разделительная линия */
  .vertical-menu-dropdown .mobile-back::after {
    content: "";
    display: block;
    height: 1px;
    margin-top: 12px;
    background: rgba(165,33,38,.12);
  }

  /* ===== MENU ITEMS ===== */

  .vertical-menu-dropdown .nav-center {
    display: flex;
    flex-direction: column;
    gap: 14px;

    position: static;
    transform: none;
  }

.vertical-menu-dropdown .nav-center a {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: .01em;

  color: #6f1f1f;

  text-decoration: none;

  position: relative;
  padding: 6px 0;

  /* 🔑 ШАГ 1 — iOS-резкость */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  text-shadow: 0 0 0.01px rgba(255,255,255,.45);
}

  /* без underline */
  .vertical-menu-dropdown .nav-center a::after {
    display: none;
  }

  /* active — БЕЗ bold */
.vertical-menu-dropdown .nav-center a.active {
  color: #a52126;

  font-weight: 560; /* 🔑 визуальный фокус */

  text-shadow:
    0 0 0.01px rgba(255,255,255,.55),
    0 0 6px rgba(165,33,38,.12);
}

  /* iOS-подсветка */
  .vertical-menu-dropdown .nav-center a.active::before {
    content: "";
    position: absolute;
    left: -12px;
    right: -12px;
    top: -6px;
    bottom: -6px;

    background: rgba(165,33,38,.08);
    border-radius: 12px;
    z-index: -1;
  }
}

/* ===== TOP BACK SECTION (iOS style) ===== */

.vertical-menu-dropdown .mobile-back {
  position: relative;               /* 🔑 обязательно */

  display: flex;
  align-items: center;
  justify-content: center;           /* 🔑 центр */

  padding: 8px 0 14px;
  margin-bottom: 14px;

  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: #732323;

  cursor: pointer;
  user-select: none;
}

/* divider как в образце */
.vertical-menu-dropdown .mobile-back::after {
  content: "";
  position: absolute;
  left: 18px;                       /* ⬅️ на всю ширину sheet */
  right: 18px;
  bottom: 0;

  height: 1px;
  background: rgba(165,33,38,.12);
}

@media (max-width: 768px) {

  /* =========================
     📱 iOS RIBBON WINDOW
     ========================= */

  .gallery-grid {
    position: relative;
    display: block !important;

    height: 100vh;          /* физическое окно */
    overflow-y: auto;       /* ✅ scroll */
    -webkit-overflow-scrolling: touch;
    will-change: scroll-position; /* 🔑 Safari fix */

    background:
      linear-gradient(
        to bottom,
        rgba(255,246,248,.55),
        rgba(255,232,238,.35)
      );

    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
  }

  /* =========================
     📼 RIBBON ITEMS (TRACK)
     ========================= */

  .gallery-grid > .photo-item {
    position: relative;
    display: block !important;

    width: 100% !important;
    height: 250px !important;

    margin: 16px 0;

    will-change: transform;
  }

  /* ❌ отключаем desktop grid логику */
  .gallery-grid > .photo-item.big,
  .gallery-grid > .photo-item.tall {
    grid-column: auto !important;
    grid-row: auto !important;
  }

  /* =========================
     🎯 ACTIVE FOCUS (iOS)
     ========================= */

  .gallery-grid > .photo-item {
    opacity: .75;
    transition:
      transform .25s ease,
      opacity .25s ease;
  }

  .gallery-grid > .photo-item.active {
    transform: scale(1.04);
    opacity: 1;
  }
}

/* =========================
   📱 iOS RIBBON — MOBILE
   ========================= */
@media (max-width: 768px) {

  /* 🍎 ribbon visual mask */
  .gallery-grid {
    position: relative;

    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      black 10%,
      black 90%,
      transparent 100%
    );
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      black 10%,
      black 90%,
      transparent 100%
    );
  }

  /* 📐 square photo */
  .gallery-grid .photo-item-inner {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .gallery-grid .photo-item-inner img {
    width: 250px;
    height: 250px;

    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    object-fit: cover;
    border-radius: 20px;

    box-shadow: 0 12px 22px rgba(0,0,0,.18);
  }

  /* убираем back */
  .gallery-grid .photo-item-inner img.back {
    display: none;
  }


}

#coupleName{
  opacity:0;
  transform: translateY(6px);
  transition: all .4s ease;
}


.nav-center a[data-page="wed_party.html"]{
  display: none;
}


/* =========================
   GLASS LOADING OVERLAY
   ========================= */

#loadingOverlay {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      to bottom,
      rgba(255,240,245,.65),
      rgba(255,220,230,.55)
    );

  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);

  z-index: 999999;

  opacity: 1;
  transition: opacity .45s ease;
}

#loadingOverlay.hide {
  opacity: 0;
  pointer-events: none;
}

/* spinner */
.loader {
  width: 56px;
  height: 56px;

  border-radius: 50%;
  border: 4px solid rgba(165,33,38,.15);
  border-top: 4px solid #a52126;

  animation: spin .9s linear infinite;

  box-shadow:
    0 0 30px rgba(165,33,38,.35);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}



</style>
</head>

<header>

<!-- 👇 ВОТ ЭТА СТРОКА -->

</div>

<script>

const gallery = document.getElementById("gallery");


const SUPABASE_URL="https://octwwpatppbenqwkcqaw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jdHd3cGF0cHBiZW5xd2tjcWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5NjYxMjYsImV4cCI6MjA3NDU0MjEyNn0.kYX1yCkx3Zl2J_qLHZYcknLnx_aXl26zB--__MzkknI";
const SUPABASE_BUCKET="galleries";

function buildPublicUrl(bucket,path){
  if(!path)return "";
  const trimmed=path.replace(/^\/+/,"");
  const parts=trimmed.split("/");
  if(parts.length===1)
    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(trimmed)}`;
  const folder=parts.slice(0,-1).join("/");
  const filename=encodeURIComponent(parts.at(-1));
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${folder}/${filename}`;
}

async function loadCoupleName(token){
  try{

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/sites?select=couple_name,wedding_date&edit_token=eq.${token}`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    );

    const arr = await res.json();
    if (!arr || !arr.length) return;

    const name = arr[0].couple_name;
    const weddingDate = arr[0].wedding_date;

    if (name) {

const el = document.getElementById("coupleName");

el.textContent = name;

requestAnimationFrame(() => {
  el.style.opacity = "1";
  el.style.transform = "translateY(0)";
});

      document.title = `${name} – Photo Gallery`;
    }

    if (weddingDate) {
      const d = new Date(weddingDate);

      const formatted = d.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      document.getElementById("eventDate").textContent = formatted;
    }

  }catch(e){
    console.log("loadCoupleName failed", e);
  }
}

let photos=[];
let currentIndex=0;
let lightboxOpen = false;
let active = true;


function openLightbox(i){
  lightboxOpen = true;
  active = false;

  currentIndex=i;
  lightImg.src=photos[i];

  history.pushState(
  { ribbonScroll: gallery.scrollTop, lightbox: true },
  "",
  "#photo"
);


  lightbox.style.display="flex";
  requestAnimationFrame(()=>lightbox.classList.add("show"));
}

function closeLightbox(){
  lightbox.classList.remove("show");
  setTimeout(()=>{
    lightbox.style.display="none";
    lightboxOpen = false;
    active = true;

    history.back();   // ← ВОТ ЭТО КЛЮЧ
  },300);
}

function next(){
  currentIndex=(currentIndex+1)%photos.length;
  lightImg.src=photos[currentIndex];
}
function prev(){
  currentIndex=(currentIndex-1+photos.length)%photos.length;
  lightImg.src=photos[currentIndex];
}

prevBtn.onclick=prev;
nextBtn.onclick=next;

lightbox.addEventListener("click", (e) => {
  // если клик НЕ по стрелкам — закрываем
  if (!e.target.closest(".arrow-btn")) {
    closeLightbox();
  }
});

document.addEventListener("keydown",e=>{
  if(lightbox.style.display==="flex"){
    if(e.key==="ArrowRight") next();
    if(e.key==="ArrowLeft") prev();
    if(e.key==="Escape") closeLightbox();
  }
});

async function loadGallery(){
  const grid = document.getElementById("gallery");
  grid.textContent = "Loading...";

  const params = new URLSearchParams(location.search);
  let token =
    params.get("token") ||
    params.get("t") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if(!token){
    grid.innerHTML = "<p>No token provided</p>";
    return;
  }

  sessionStorage.setItem("rsvpToken", token);

  let rows = [];
  try{

 "x-edit-token": token   // ← ВОТ ЭТО

    });

  }catch{

    return;

  grid.innerHTML = "";

  if(!Array.isArray(rows) || !rows.length){
    grid.innerHTML = "<p>No photos yet...</p>";

  const start = 145;
  const total = 50;

  const allSlots = Array.from(
    { length: total },
    (_, i) => `jm_img${start + i}`
  );

  const rowsMap = Object.fromEntries(rows.map(r => [r.slot, r]));
  photos = [];

let realIndex = 0;

allSlots.forEach((slot) => {
  const r = rowsMap[slot];
  if (!r || !r.path) return;

  const url = buildPublicUrl(SUPABASE_BUCKET, r.path) + `?v=${Date.now()}`;
  photos.push(url);
const photoIndex = photos.length - 1;


  const div = document.createElement("div");
  div.className = "photo-item";

  // 🔥 ВОССТАНАВЛИВАЕМ DESKTOP ЛЕЙАУТ
  if (realIndex === 1 || realIndex === 8) div.classList.add("big");
  if (realIndex === 0 || realIndex === 11) div.classList.add("tall");

  div.innerHTML = `
    <div class="photo-item-inner">
      <img class="front" src="${url}" loading="lazy">
      <img class="back" src="${url}" loading="lazy">
    </div>
    <p class="caption-text">${r.caption || ""}</p>
  `;

  grid.appendChild(div);

  div.querySelectorAll("img").forEach(img => {
    img.onerror = () => {
      setTimeout(() => {
        img.src = img.src.split("?")[0] + "?v=" + Date.now();
      }, 500);
    };
  });

div.addEventListener("click", () => {
  openLightbox(photoIndex);
});


  realIndex++;   // ⬅️ ключ
});

<script>
function getToken() {
  const params = new URLSearchParams(location.search);
  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (token) sessionStorage.setItem("rsvpToken", token);
  return token;
}

function buildLink(path) {
  const token = getToken();

  if (path === "home") {
    return `https://flowwed.netlify.app/index.html?t=${token}`;
  }

  if (!token) return path;
  return `${path}?t=${token}`;
}

document.querySelectorAll("[data-page]").forEach(link => {
  const page = link.dataset.page;
  link.href = buildLink(page);
});

function goBack() {
  history.length > 1 ? history.back() : window.location.href = buildLink("home");
}
</script>

<script>
(function setActiveNav() {
  let current = location.pathname.split("/").pop();

  // Netlify: /photo_gallery → photo_gallery
  // Local: photo_gallery.html → photo_gallery
  current = current.replace(".html", "");

  document.querySelectorAll(".nav-center a").forEach(link => {
    let page = link.dataset.page || "";

    // приводим data-page к такому же виду
    page = page.replace(".html", "");

    if (page === current) {
      link.classList.add("active");
    }
  });
})();
</script>

<script>

const vMenu = document.getElementById("verticalMenuDropdown");
const navCenter = document.querySelector(".nav-center");

let vOpen = false;

/* клонируем меню ОДИН РАЗ */
if (window.innerWidth <= 900 && navCenter && vMenu.childElementCount === 0) {


  // mobile Back (section header)
  const back = document.createElement("div");

  back.textContent = "← Back";
  back.onclick = goBack;

  vMenu.appendChild(back);
  vMenu.appendChild(navCenter.cloneNode(true));
}

/* toggle */
vBtn?.addEventListener("click", e => {
  e.stopPropagation();
  vOpen = !vOpen;
  vMenu.classList.toggle("open", vOpen);
});

/* клик по пункту — закрывает */
vMenu.addEventListener("click", e => {
  if (!e.target.closest("a")) return;
  vOpen = false;
  vMenu.classList.remove("open");
});

/* клик вне — закрывает */
document.addEventListener("click", () => {
  if (!vOpen) return;
  vOpen = false;
  vMenu.classList.remove("open");
});
</script>

<script>
(function () {
  if (window.innerWidth > 768) return;

  const gallery = document.getElementById("gallery");
  if (!gallery) return;

let speed = 1;
let active = true;
let lightboxOpen = false;

  window.addEventListener("load", () => {

    setInterval(() => {
  if (!active || lightboxOpen) return;

  gallery.scrollTop += speed;

}, 16);

  });

  // пауза при касании
  gallery.addEventListener("touchstart", () => active = false, { passive: true });
  gallery.addEventListener("touchend",   () => active = true);
  gallery.addEventListener("touchcancel",() => active = true);

})();
</script>

<script>

window.addEventListener("popstate", (e) => {

  // закрытие лайтбокса по Back
  if (lightbox.style.display === "flex") {
    lightbox.classList.remove("show");
    setTimeout(()=>{
      lightbox.style.display="none";
      lightboxOpen = false;
      active = true;
    },300);
  }

  // восстановление позиции ribbon
  if (e.state && typeof e.state.ribbonScroll === "number") {
    requestAnimationFrame(() => {
      gallery.scrollTop = e.state.ribbonScroll;
    });
  }
});

</script>
