<style>

html, body {

  margin: 0;
  padding: 0;

  overflow: hidden;
  height: 100%;

  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);

  background: linear-gradient(
    180deg,
    #fff7f8,
    #e7c3cb
  );

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #732323;
}

.mobile-header {

  position: sticky;

  top: 0;

  z-index: 99999;

  padding: 12px 18px;

  min-height: 64px;


  background: rgba(255,245,248,.96);

  display: flex;

  align-items: center;

  justify-content: space-between;

  box-shadow: 0 8px 24px rgba(0,0,0,.08);

}

.title {

  position: absolute;

  left: 50%;
  transform: translateX(-50%);

  font-size: 22px;
  font-weight: 800;

  white-space: nowrap;
}

.mobile-header .burger{

  position:absolute !important;

  left:16px !important;
  top:50% !important;

  transform:translateY(-50%) !important;
}

.music-btn {
position:absolute;
right:16px;

top:50%;

transform:translateY(-50%);
  border: none;
  border-radius: 999px;
  padding: 11px 15px;

  background: white;

  color: #a52126;

  font-size: 18px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.12);
}

.ribbon-shell {

  width: 100%;

  height: calc(100svh - 72px);

  overflow: hidden;

  padding: 12px 14px 0px;

  box-sizing: border-box;

  touch-action: pan-y;

  -webkit-overflow-scrolling: touch;

}



.ribbon-mover {

  will-change: transform;

  transform: translate3d(0,0,0);

}


.ribbon-track {

  display: flex;
  flex-direction: column;

  gap: 12px;

  width: 100%;

will-change: transform;

backface-visibility: hidden;


transform: translateZ(0);

contain: layout paint;

}

.photo-card {

  position: relative;

  width: 100%;

  max-width: 340px;

  margin: 0 auto;

  flex-shrink: 0;

  overflow: hidden;

  border-radius: 24px;

  background: #f7eeee;


--music-offset: 0px;
--music-scale: 1;
--music-rotate: 0deg;

will-change: transform;

}

.photo-card.floating {

  animation:
    cardFloat 6s ease-in-out infinite;

}


@keyframes cardFloat {

  0% {
    transform:
      translateY(calc(0px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(0deg + var(--music-rotate)));
  }

  25% {
    transform:
      translateY(calc(-3px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(-0.4deg + var(--music-rotate)));
  }

  50% {
    transform:
      translateY(calc(-6px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(0.4deg + var(--music-rotate)));
  }

  75% {
    transform:
      translateY(calc(-3px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(-0.3deg + var(--music-rotate)));
  }

  100% {
    transform:
      translateY(calc(0px + var(--music-offset)))
      scale(var(--music-scale))
      rotate(calc(0deg + var(--music-rotate)));
  }
}

.photo-card img {

  width: 100%;

  max-height: 320px;

  object-fit: contain;

  display: block;

  border-radius: 22px;

  background: #f7eeee;

  box-shadow:
    0 10px 22px rgba(0,0,0,0.14),
    0 3px 8px rgba(0,0,0,0.08);
}

.caption {

  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 14px;

  padding: 8px 14px 6px;

  border-radius: 18px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.42),
      rgba(0,0,0,.18),
      rgba(0,0,0,.04)
    );

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,.12);

  color: white;

  font-size: 15px;
  line-height: 20px;

  text-shadow:
    0 2px 12px rgba(0,0,0,.65),
    0 1px 2px rgba(0,0,0,.45);

  box-shadow:
    0 8px 30px rgba(0,0,0,.18);

  overflow: hidden;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;

  height: 30px;

  transition:
    height .4s ease,
    background .35s ease;
}

.photo-card:hover .caption {

  -webkit-line-clamp: unset;

  height: auto;

  max-height: 240px;

  background: rgba(255,255,255,.22);
}



.loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(255,245,248,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a52126;
  font-size: 18px;
  font-weight: 700;
}

.loading.hide {
  display: none;
}

.empty {
  text-align: center;
  padding: 80px 24px;
  font-size: 17px;
  color: #8f1d1d;
}

.lightbox {

  position: fixed;
  inset: 0;

  z-index: 200;

  background: rgba(0,0,0,.72);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
  box-sizing: border-box;

  opacity: 0;
  pointer-events: none;

  transition:
    opacity .24s ease;

}

.lightbox.active {

  opacity: 1;

  pointer-events: auto;
}


.lightbox-content {
  width: 100%;
}

.lightbox img {
  width: 100%;
  max-height: 88dvh;
  object-fit: contain;
  border-radius: 20px;
}

.lightbox-caption {
  margin-top: 12px;
  background: rgba(255,255,255,.92);
  color: #5a1c1c;
  padding: 12px 14px;
  border-radius: 16px;
  font-size: 16px;
  line-height: 1.6;
}

.lightbox-close {

  position: fixed;

  top: 18px;
  right: 18px;

  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(255,255,255,.12);


  border: 1px solid rgba(255,255,255,.18);

  color: white;

  font-size: 22px;
  font-weight: 300;

  box-shadow:
    0 8px 24px rgba(0,0,0,.18);

  z-index: 300;

  transition:
    transform .22s ease,
    background .22s ease;
}

.lightbox-close:active {

  transform: scale(.92);

  background: rgba(255,255,255,.18);
}


.lightbox-arrow {

  position: fixed;

  top: 50%;

  transform: translateY(-50%);

  width: 46px;
  height: 46px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.16);

  background: rgba(255,255,255,.08);


  color: white;

  font-size: 30px;
  font-weight: 300;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 300;

  box-shadow:
    0 8px 24px rgba(0,0,0,.18);

  transition:
    transform .22s ease,
    background .22s ease,
    opacity .22s ease;

  opacity: .72;
}

.lightbox-arrow.left {
  left: 16px;
}

.lightbox-arrow.right {
  right: 16px;
}

.lightbox-arrow:active {

  transform:
    translateY(-50%)
    scale(.92);

  background:
    rgba(255,255,255,.16);
}


@media (orientation: landscape) {

 .mobile-header {
    display: none !important;
  }


  .ribbon-shell {
    height: 100svh;
padding-top: 18px;
    padding-bottom: 18px;

  }

  .lightbox {

  }

  .lightbox-content {

    align-items: center;

  .lightbox img {

    height: 100svh;

.ribbon-track-wrap {

  flex-direction: column;

  will-change: transform;


}


body.lightbox-open .mobile-header {

  visibility: hidden;
  pointer-events: none;
}

<script>
function getToken() {
  const params = new URLSearchParams(location.search);

  const token =
    params.get("t") ||
    params.get("token") ||
    sessionStorage.getItem("rsvpToken") ||
    "";

  if (token) {
    sessionStorage.setItem("rsvpToken", token);
  }

  return token;
}

function buildLink(path) {
  const token = getToken();
  if (!token) return path;
  return `${path}?token=${token}`;
}

function goBack() {
  if (history.length > 1) {
    history.back();
  } else {
    window.location.href = buildLink("home");
  }
}
</script>

function updateVisibleCardAnimations() {

  const cards =
    document.querySelectorAll(".photo-card");

  const vh =
    window.innerHeight;

  cards.forEach(card => {

    const rect =
      card.getBoundingClientRect();

    const visible =
      rect.bottom > -200 &&
      rect.top < vh + 200;

    if (visible) {

      card.classList.add("floating");

    } else {

      card.classList.remove("floating");

<script>

function initRibbonAnimation() {


const debugBox = document.createElement("div");

debugBox.style.position = "fixed";
debugBox.style.bottom = "10px";
debugBox.style.left = "10px";
debugBox.style.zIndex = "99999";
debugBox.style.background = "rgba(0,0,0,.7)";
debugBox.style.color = "white";
debugBox.style.padding = "8px 12px";
debugBox.style.borderRadius = "12px";
debugBox.style.fontSize = "12px";

document.body.appendChild(debugBox);

const mover =
  document.getElementById("ribbonMover");

const track =
  document.getElementById("ribbon");


  if (!track) return;

  if (track.children.length < 1) return;


  let y = 0;

  const speed = 0.60;

let virtualOffset = 0;

let recycleThreshold = 0;

  let isDragging = false;

  let startY = 0;
let velocity = 0;


function getSingleHeight() {
  return track.scrollHeight;
}


let lastVisibilityUpdate = 0;

function animate() {

const start = performance.now();

  if (document.hidden) {

    setTimeout(() => {

      requestAnimationFrame(animate);

    }, 120);

    return;
  }

  if (!isDragging) {

    virtualOffset += speed;

    virtualOffset -= velocity;

    velocity *= 0.92;
  }

  if (Math.abs(velocity) < 0.02) {
    velocity = 0;
  }



const totalHeight =
  track.scrollHeight -
  window.innerHeight;



if (virtualOffset >= totalHeight) {
  virtualOffset = 0;
}

const loopOffset = virtualOffset;


mover.style.transform =
  `translate3d(0, ${-loopOffset}px, 0)`;

  if (performance.now() - lastVisibilityUpdate > 180) {

    updateVisibleCardAnimations();

    lastVisibilityUpdate = performance.now();
  }

const frame =
  performance.now() - start;

debugBox.textContent =
  "frame: " + frame.toFixed(1);

requestAnimationFrame(animate);


}

animate();

  // TOUCH DRAG

  track.addEventListener("touchstart", e => {

    isDragging = true;

    startY = e.touches[0].clientY;

  }, { passive: true });

  track.addEventListener("touchmove", e => {

    if (!isDragging) return;

    const delta =
      e.touches[0].clientY - startY;

    startY = e.touches[0].clientY;

virtualOffset -= delta;

if (virtualOffset < 0) {
  virtualOffset = 0;
}



    velocity = delta * 0.22;

  }, { passive: true });

  track.addEventListener("touchend", () => {

    isDragging = false;

  });

}
</script>


<script>

function startMusicMotion() {

  const cards =
    document.querySelectorAll(".photo-card");

function animateMusic() {

  if (!analyser) {
    requestAnimationFrame(animateMusic);
    return;
  }

  analyser.getByteFrequencyData(dataArray);

  let avg = 0;

  for (let i = 0; i < dataArray.length; i++) {
    avg += dataArray[i];
  }

  avg /= dataArray.length;

  const power = avg / 255;

cards.forEach((card, index) => {

  if (!card.classList.contains("floating")) {
    return;
  }

  const offset =
    Math.sin(Date.now() * 0.001 + index) * 2;

  const pulse =
    Math.sin(Date.now() * 0.002 + index) * 0.018;

  const scale =
    1 + power * 0.025 + pulse;

  const rotate =
    Math.sin(Date.now() * 0.0007 + index)
    * power * 1.5;

  card.style.setProperty(
    "--music-offset",
    `${offset}px`
  );

  card.style.setProperty(
    "--music-scale",
    scale
  );

  card.style.setProperty(
    "--music-rotate",
    `${rotate}deg`
  );

});

requestAnimationFrame(animateMusic);

}

animateMusic();

}

</script>
